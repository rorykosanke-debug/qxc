name: 更新数据

on:
  schedule:
    # 北京时间 21:00 / 21:50 / 22:00 / 22:40（UTC 比北京晚 8 小时）
    - cron: '0 13 * * *'    # 21:00
    - cron: '50 13 * * *'   # 21:50
    - cron: '0 14 * * *'    # 22:00
    - cron: '40 14 * * *'   # 22:40
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行抓取脚本
        run: node fetch-data.js

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "自动更新数据 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
