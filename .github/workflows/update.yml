name: 定时抓取开奖数据

on:
  schedule:
    - cron: '0 13 * * *'    # 北京 21:00
    - cron: '30 13 * * *'   # 北京 21:30
    - cron: '50 13 * * *'   # 北京 21:50
    - cron: '0 14 * * *'    # 北京 22:00
    - cron: '40 14 * * *'   # 北京 22:40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-qxc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取数据
        run: node fetch-data.js

      - name: 提交 data.json
        run: |
          git config user.name "qxc-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain data.json)" ]; then
            git add data.json
            git commit -m "chore: 更新开奖数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "data.json 没有变化，跳过提交"
          fi
