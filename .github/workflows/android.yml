name: 打包安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 检查 index.html 是否完整
        run: |
          SIZE=$(wc -c < index.html)
          echo "index.html 大小：$SIZE 字节"
          tail -c 40 index.html
          echo ""
          if [ "$SIZE" -lt 5000 ]; then echo "❌ 文件太小，可能被截断"; exit 1; fi
          if ! grep -q '</html>' index.html; then echo "❌ 末尾缺少 </html>"; exit 1; fi
          echo "✓ 文件完整"

      - name: 准备网页目录
        run: |
          mkdir -p www
          cp index.html www/index.html
          if ls *.js >/dev/null 2>&1; then cp -v *.js www/; fi
          if [ -f data.json ]; then cp data.json www/data.json; else echo '{}' > www/data.json; fi
          ls -l www

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund

      - name: 写入 Capacitor 配置
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rorykosanke.qxc",
            "appName": "开奖号码",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          EOF
          cat capacitor.config.json

      - name: 生成安卓工程
        run: |
          npx cap add android
          npx cap sync android

      - name: 配置 Maven 镜像（解决下载失败）
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  google()
                  mavenCentral()
              }
          }
          settingsEvaluated { s ->
              s.pluginManagement.repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat ~/.gradle/init.gradle

      - name: 打包 APK（失败自动重试 3 次）
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试 ==="
            if ./gradlew assembleDebug --no-daemon; then echo "✓ 打包成功"; break; fi
            echo "第 $i 次失败，等 20 秒后重试"
            sleep 20
          done
          ls -l app/build/outputs/apk/debug/ || true
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: 改名整理
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/kai-jiang-v${{ github.run_number }}.apk"
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kai-jiang-apk
          path: out/*.apk

      - name: 发布到 Releases
        uses: actions/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 开奖号码 v${{ github.run_number }}
          files: out/*.apk
          body: |
            自动打包 · 提交 ${{ github.sha }}
