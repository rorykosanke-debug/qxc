name: 打包安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备网页目录
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f data.json ]; then cp data.json www/data.json; else echo '{}' > www/data.json; fi
          echo "index.html 大小：$(wc -c < www/index.html) 字节"
          sha1sum www/index.html

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          npx cap --version

      - name: 写入 Capacitor 配置（开启直连）
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rorykosanke.qxc",
            "appName": "开奖号码",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          cat capacitor.config.json

      - name: 生成安卓工程
        run: |
          npx cap add android
          npx cap sync android

      - name: 打包 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 改名整理
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/kai-jiang-v${{ github.run_number }}.apk"
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kai-jiang-apk
          path: out/*.apk
          retention-days: 30

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 开奖号码 v${{ github.run_number }}
          files: out/*.apk
          body: |
            自动打包 · 基于提交 ${{ github.sha }}

            安装：下载 kai-jiang-v${{ github.run_number }}.apk，直接覆盖安装即可。
