name: 打包安卓 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查自带 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME" || true

      - name: 初始化 Capacitor 工程
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f data.json ]; then cp data.json www/data.json; fi
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rorykosanke.qxc",
            "appName": "开奖号码",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理 APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/kai-jiang-v${{ github.run_number }}.apk"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 开奖号码 APK 第 ${{ github.run_number }} 版
          body: 自动构建，包含打包时的最新开奖数据
          files: out/*.apk
