name: update-lottery

on:
  schedule:
    - cron: '15,45 12-14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取开奖数据
        run: node fetch-data.js

      - name: 提交 data.json
        run: |
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "update lottery data"
            git push
          fi
