<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f43f5e">
<title>七星彩 · 排列五 开奖号码</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
  .num{font-variant-numeric:tabular-nums}
  .ball{display:flex;align-items:center;justify-content:center;background:#fff1f2;color:#e11d48;font-weight:800;font-size:26px;line-height:1;padding:15px 0;border-radius:14px}
  .ball.sm{font-size:19px;padding:9px 0;border-radius:9px}
  @keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .anim-up{animation:up .22s ease-out}
  .anim-pop{animation:pop .18s ease-out}
  input{font-family:inherit}
</style>
</head>
<body class="bg-slate-100 text-slate-900">

<div class="mx-auto w-full max-w-[520px] pb-32">

  <header class="sticky top-0 z-20 bg-slate-100/95 backdrop-blur px-4 pt-4">
    <div class="flex items-center justify-between">
      <h1 class="text-[22px] font-extrabold tracking-tight">开奖号码</h1>
      <button id="btnRefresh" class="px-4 py-2 rounded-full bg-white text-slate-600 text-sm font-medium shadow-sm active:scale-95 transition">刷新</button>
    </div>
    <div class="mt-3 grid grid-cols-2 gap-2.5">
      <button data-game="qxc" class="tab"></button>
      <button data-game="pl5" class="tab"></button>
    </div>
    <p id="statusLine" class="mt-2 mb-2 text-xs text-slate-400 min-h-[16px]"></p>
  </header>

  <main id="main" class="px-4"></main>

  <p class="px-5 mt-6 text-[11px] leading-relaxed text-slate-400">
    数据由 GitHub Actions 每期开奖后自动更新。<br>
    点「刷新」会立即触发一次后台抓取。<br>
    手动录入的期号只保存在这台手机里，可随时删除。
  </p>
</div>

<div class="fixed inset-x-0 bottom-0 z-30 bg-gradient-to-t from-slate-100 via-slate-100 to-transparent pt-6"
     style="padding-bottom:calc(0.75rem + env(safe-area-inset-bottom,0px))">
  <div class="mx-auto w-full max-w-[520px] px-4">
    <button id="btnAdd" class="w-full h-12 rounded-2xl bg-slate-900 text-white font-bold active:scale-[.99] transition">＋ 手动录入</button>
  </div>
</div>

<!-- 录入面板 -->
<div id="sheet" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-black/40" data-close="1"></div>
  <div class="anim-up absolute inset-x-0 bottom-0 bg-white rounded-t-3xl px-5 pt-5"
       style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))">
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-bold">手动录入 · <span id="sheetGame"></span></h2>
      <button data-close="1" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 text-xl leading-none">×</button>
    </div>
    <div class="mt-4">
      <label class="block text-xs text-slate-400 mb-1.5">期号</label>
      <input id="fIssue" inputmode="numeric" placeholder="如 26137"
             class="num w-full h-12 px-4 rounded-2xl bg-slate-100 outline-none focus:ring-2 focus:ring-rose-300">
      <label class="block text-xs text-slate-400 mb-1.5 mt-3">开奖日期</label>
      <input id="fDate" type="date"
             class="num w-full h-12 px-4 rounded-2xl bg-slate-100 outline-none focus:ring-2 focus:ring-rose-300">
      <label class="block text-xs text-slate-400 mb-1.5 mt-3">号码（按位填，自动加空格）</label>
      <input id="fCodes" inputmode="numeric"
             class="num w-full h-12 px-4 rounded-2xl bg-slate-100 outline-none focus:ring-2 focus:ring-rose-300 text-lg tracking-widest">
      <p id="fErr" class="text-sm text-rose-600 mt-2 min-h-[20px]"></p>
    </div>
    <button id="btnSave" class="w-full h-12 rounded-2xl bg-rose-600 text-white font-bold active:scale-[.99] transition">保存</button>
  </div>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-4 z-50 hidden"></div>

<script>
const NAMES = { qxc: '七星彩', pl5: '排列五' };
const LENS  = { qxc: 7, pl5: 5 };

const LS_MANUAL = 'lottery_manual_v1';
const REMOTE_DATA = 'https://rorykosanke-debug.github.io/qxc/data.json';

/* ====== 触发后台更新用的令牌 ====== */
const GH_REPO  = 'rorykosanke-debug/qxc';
const GH_TOKEN = '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';
const GH_REF   = 'main';

const TAB_ON  = 'tab h-12 rounded-2xl font-bold text-base bg-rose-600 text-white shadow-lg shadow-rose-600/25 active:scale-[.98] transition';
const TAB_OFF = 'tab h-12 rounded-2xl font-bold text-base bg-white text-slate-500 active:scale-[.98] transition';

const STATE = {
  game: 'qxc',
  remote: { qxc: [], pl5: [], updatedAt: null },
  manual: { qxc: [], pl5: [] },
  loading: true,
  error: '',
  pendingDelete: null,
  running: false
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 号码解析：严格按位数 ---------- */
function toCodes(raw, len) {
  let s = Array.isArray(raw) ? raw.join(' ') : String(raw == null ? '' : raw);
  const tokens = s.split(/[\s,，、+]+/).filter(Boolean);
  if (tokens.length === len && tokens.every(t => /^\d$/.test(t))) return tokens;
  const digits = s.replace(/\D/g, '');
  if (digits.length < len) return null;
  return digits.slice(0, len).split('');
}

/* ---------- 本地手动数据 ---------- */
function loadManual() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_MANUAL) || '{}');
    STATE.manual.qxc = Array.isArray(raw.qxc) ? raw.qxc : [];
    STATE.manual.pl5 = Array.isArray(raw.pl5) ? raw.pl5 : [];
  } catch (e) {}
}
function saveManualStore() {
  try {
    localStorage.setItem(LS_MANUAL, JSON.stringify({ qxc: STATE.manual.qxc, pl5: STATE.manual.pl5 }));
  } catch (e) {}
}

/* ---------- 合并 + 排序 ---------- */
function listFor(game) {
  const map = new Map();
  STATE.remote[game].forEach(it => map.set(it.issue, it));
  STATE.manual[game].forEach(it => map.set(it.issue, { ...it, manual: true }));
  return [...map.values()].sort((a, b) => (Number(b.issue) || 0) - (Number(a.issue) || 0));
}

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2, '0');
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function shortDate(s) { const m = String(s || '').match(/(\d{1,2})-(\d{1,2})$/); return m ? `${m[1]}-${m[2]}` : (s || ''); }
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.innerHTML = `<div class="anim-pop px-4 py-2.5 rounded-full bg-slate-900/90 text-white text-sm shadow-lg">${esc(msg)}</div>`;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2000);
}

/* ---------- 渲染 ---------- */
function rowHtml(it) {
  const len = LENS[STATE.game];
  const pending = STATE.pendingDelete === it.issue;
  const tail = it.manual
    ? `<button data-del="${esc(it.issue)}" class="w-9 h-9 rounded-full leading-none ${pending
        ? 'bg-rose-100 text-rose-600 text-[11px] font-bold'
        : 'text-slate-300 text-lg'}">${pending ? '删' : '×'}</button>`
    : `<span class="inline-block w-9"></span>`;

  return `<div class="flex items-center gap-2 px-3 py-2 border-t border-slate-100">
    <div class="w-14 shrink-0">
      <div class="text-[13px] font-semibold num leading-tight">${esc(it.issue)}</div>
      <div class="text-[11px] text-slate-400 num">${esc(shortDate(it.date))}</div>
    </div>
    <div class="flex-1 grid gap-1" style="grid-template-columns:repeat(${len},minmax(0,1fr))">
      ${it.codes.map(c => `<div class="ball sm">${esc(c)}</div>`).join('')}
    </div>
    <div class="shrink-0 text-right">${tail}</div>
  </div>`;
}

function render() {
  document.querySelectorAll('.tab').forEach(btn => {
    const on = btn.dataset.game === STATE.game;
    btn.className = on ? TAB_ON : TAB_OFF;
    btn.textContent = NAMES[btn.dataset.game];
  });

  const s = $('statusLine');
  if (STATE.running) {
    s.textContent = '后台正在抓取，稍等自动更新…';
    s.className = 'mt-2 mb-2 text-xs text-rose-500 min-h-[16px]';
  } else if (STATE.error) {
    s.textContent = STATE.error;
    s.className = 'mt-2 mb-2 text-xs text-rose-500 min-h-[16px]';
  } else if (STATE.loading && !STATE.remote.updatedAt) {
    s.textContent = '正在获取数据…';
    s.className = 'mt-2 mb-2 text-xs text-slate-400 min-h-[16px]';
  } else {
    s.textContent = STATE.remote.updatedAt ? '数据更新于 ' + fmtTime(STATE.remote.updatedAt) : '';
    s.className = 'mt-2 mb-2 text-xs text-slate-400 min-h-[16px]';
  }

  const main = $('main');
  const list = listFor(STATE.game);
  const len = LENS[STATE.game];

  if (!list.length) {
    main.innerHTML = `<section class="bg-white rounded-3xl p-6 text-center shadow-sm">
      <div class="text-4xl">🎯</div>
      <p class="mt-3 font-semibold">还没有${NAMES[STATE.game]}数据</p>
      <p class="mt-1.5 text-sm text-slate-400 leading-relaxed">
        自动抓取还没跑出结果，可以先点下面「手动录入」临时记上。
      </p>
    </section>`;
    return;
  }

  const latest = list[0];
  const rest = list.slice(1);

  main.innerHTML = `
  <section class="bg-white rounded-3xl p-4 shadow-sm">
    <div class="flex items-start justify-between">
      <div>
        <div class="text-[17px] font-extrabold">第 ${esc(latest.issue)} 期</div>
        <div class="text-xs text-slate-400 num mt-1">${esc(latest.date)}${latest.manual ? ' · 手动录入' : ''}</div>
      </div>
      <button id="btnCopy" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-500 text-xs font-medium active:scale-95 transition">复制</button>
    </div>
    <div class="grid gap-1.5 mt-3.5" style="grid-template-columns:repeat(${len},minmax(0,1fr))">
      ${latest.codes.map(c => `<div class="ball">${esc(c)}</div>`).join('')}
    </div>
  </section>

  <section class="mt-5">
    <div class="flex items-end justify-between px-1 mb-2">
      <h2 class="text-sm font-semibold text-slate-500">历史开奖</h2>
      <span class="text-xs text-slate-400 num">共 ${list.length} 期</span>
    </div>
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
      ${rest.length
        ? rest.map(rowHtml).join('')
        : `<div class="py-10 text-center text-sm text-slate-400">暂无更多历史</div>`}
    </div>
  </section>`;

  const copyBtn = $('btnCopy');
  if (copyBtn) copyBtn.onclick = () => copyLatest(latest);
}

/* ---------- 复制 ---------- */
async function copyLatest(it) {
  const text = `${NAMES[STATE.game]} 第${it.issue}期 ${it.date}\n${it.codes.join(' ')}`;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  } catch (e) {
    toast('复制失败，请长按选择');
  }
}

/* ---------- 取数据：线上优先，本地兜底 ---------- */
async function loadRemote() {
  STATE.loading = true;
  render();
  try {
    const urls = [
      REMOTE_DATA + '?v=' + Date.now(),
      './data.json?v=' + Date.now()
    ];

    let json = null;
    for (const u of urls) {
      try {
        const res = await fetch(u, { cache: 'no-store' });
        if (!res.ok) continue;
        const j = await res.json();
        if (j && (Array.isArray(j.qxc) || Array.isArray(j.pl5))) { json = j; break; }
      } catch (e) {}
    }
    if (!json) throw new Error('无可用数据');

    const remote = { qxc: [], pl5: [], updatedAt: json.updatedAt || null };
    ['qxc', 'pl5'].forEach(k => {
      const arr = Array.isArray(json[k]) ? json[k] : [];
      arr.forEach(it => {
        const codes = toCodes(it.codes ?? it.result ?? it.code ?? it.numbers, LENS[k]);
        const issue = String(it.issue ?? it.qihao ?? '').trim();
        if (!codes || !issue) return;
        remote[k].push({
          issue,
          date: String(it.date ?? '').slice(0, 10),
          codes,
          manual: false
        });
      });
    });

    STATE.remote = remote;
    STATE.error = '';
  } catch (e) {
    STATE.error = '暂时连不上数据源，可先手动录入';
  } finally {
    STATE.loading = false;
    render();
  }
}

/* ---------- 直接调 GitHub 触发工作流 ---------- */
async function ghApi(path, opt = {}) {
  return fetch('https://api.github.com' + path, {
    ...opt,
    headers: {
      'Authorization': 'Bearer ' + GH_TOKEN,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    }
  });
}

async function triggerUpdate() {
  try {
    const r1 = await ghApi(`/repos/${GH_REPO}/actions/workflows`);
    if (!r1.ok) {
      toast('触发失败：HTTP ' + r1.status);
      console.warn(await r1.text());
      return false;
    }
    const j = await r1.json();
    const wf = (j.workflows || []).find(w => /update\.yml$/i.test(w.path || '') || w.name === '更新数据');
    if (!wf) { toast('没找到「更新数据」工作流'); return false; }

    const r2 = await ghApi(`/repos/${GH_REPO}/actions/workflows/${wf.id}/dispatches`, {
      method: 'POST',
      body: JSON.stringify({ ref: GH_REF })
    });
    if (r2.status === 204) return true;

    toast('触发失败：HTTP ' + r2.status);
    console.warn(await r2.text());
    return false;
  } catch (e) {
    toast('触发失败，请检查网络');
    return false;
  }
}

async function pollForUpdate() {
  const before = STATE.remote.updatedAt;
  for (let i = 0; i < 18; i++) {
    await sleep(10000);
    await loadRemote();
    if (STATE.remote.updatedAt && STATE.remote.updatedAt !== before) {
      STATE.running = false;
      render();
      toast('数据已更新');
      return;
    }
  }
  STATE.running = false;
  render();
  toast('这次没等到新数据，稍后再试');
}

/* ---------- 录入面板 ---------- */
function openSheet() {
  $('sheetGame').textContent = NAMES[STATE.game];
  $('fIssue').value = '';
  $('fDate').value = today();
  $('fCodes').value = '';
  $('fCodes').placeholder = Array.from({ length: LENS[STATE.game] }, (_, i) => i + 1).join(' ');
  $('fErr').textContent = '';
  $('sheet').classList.remove('hidden');
}
function closeSheet() { $('sheet').classList.add('hidden'); }

$('fCodes').addEventListener('input', () => {
  const len = LENS[STATE.game];
  const digits = $('fCodes').value.replace(/\D/g, '').slice(0, len);
  $('fCodes').value = digits.split('').join(' ');
});

$('btnSave').onclick = () => {
  const game = STATE.game;
  const len = LENS[game];
  const issue = $('fIssue').value.trim();
  const date = $('fDate').value || today();
  const err = $('fErr');
  if (!/^\d{3,10}$/.test(issue)) { err.textContent = '期号请填数字，例如 26137'; return; }
  const digits = $('fCodes').value.replace(/\D/g, '');
  if (digits.length !== len) {
    err.textContent = `${NAMES[game]}需要 ${len} 个号码，现在填了 ${digits.length} 个`;
    return;
  }
  err.textContent = '';
  STATE.manual[game] = STATE.manual[game].filter(x => x.issue !== issue);
  STATE.manual[game].unshift({ issue, date, codes: digits.split(''), manual: true });
  saveManualStore();
  STATE.pendingDelete = null;
  closeSheet();
  render();
  toast('已保存第 ' + issue + ' 期');
};

/* ---------- 事件 ---------- */
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    if (STATE.game === b.dataset.game) return;
    STATE.game = b.dataset.game;
    STATE.pendingDelete = null;
    render();
  };
});

$('btnRefresh').onclick = async () => {
  if (STATE.running) { toast('正在抓取中，请稍候'); return; }
  toast('正在通知后台更新…');
  const ok = await triggerUpdate();
  if (!ok) { loadRemote(); return; }
  STATE.running = true;
  render();
  toast('后台已开始抓取，稍等自动更新');
  pollForUpdate();
};

$('btnAdd').onclick = openSheet;
document.querySelectorAll('[data-close]').forEach(el => { el.onclick = closeSheet; });

$('main').addEventListener('click', e => {
  const btn = e.target.closest('[data-del]');
  if (!btn) return;
  const issue = btn.dataset.del;
  if (STATE.pendingDelete === issue) {
    STATE.manual[STATE.game] = STATE.manual[STATE.game].filter(x => x.issue !== issue);
    STATE.pendingDelete = null;
    saveManualStore();
    render();
    toast('已删除');
  } else {
    STATE.pendingDelete = issue;
    render();
    setTimeout(() => {
      if (STATE.pendingDelete === issue) { STATE.pendingDelete = null; render(); }
    }, 3000);
  }
});

/* ---------- 启动 ---------- */
loadManual();
render();
loadRemote();
</script>
</body>
</html>
