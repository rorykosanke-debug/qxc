<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f43f5e">
<title>七星彩 · 排列五 开奖号码</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{-webkit-text-size-adjust:100%}
  *{
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .num{font-variant-numeric:tabular-nums}

  :root{
    --ball-bg:#fff1f2;
    --ball-fg:#e11d48;
    --ring-color:#e11d48;
  }

  .balls{display:flex;align-items:center;justify-content:center;gap:3px}

  .ball{
    position:relative;
    flex:0 0 auto;width:12.5%;
    height:38px;border-radius:10px;
    --ring-size:34px;

    display:flex;align-items:center;justify-content:center;
    background:var(--ball-bg);color:var(--ball-fg);

    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable","Segoe UI","PingFang SC",system-ui,sans-serif;
    font-weight:700;font-size:21px;line-height:1;letter-spacing:0;
    font-variant-numeric:tabular-nums;

    transition:background .18s ease, color .18s ease, width .16s ease, height .16s ease, font-size .16s ease;
    touch-action:manipulation;
  }
  .ball.xs{ width:6.4%;height:30px;border-radius:7px;--ring-size:26px;font-size:12px }
  .ball.zoom{ width:18%;height:44px;border-radius:11px;--ring-size:40px;font-size:26px }

  /* 空白占位格 */
  .ball.blank{
    background:#f1f5f9;
    border:1px dashed #e2e8f0;
    color:transparent;
  }

  .ball.circled::after{
    content:'';
    position:absolute;left:50%;top:50%;
    width:var(--ring-size);height:var(--ring-size);
    margin:calc(var(--ring-size) / -2) 0 0 calc(var(--ring-size) / -2);
    border:2px solid var(--ring-color);
    border-radius:50%;
    pointer-events:none;
  }
  .ball.dragging{filter:brightness(.96)}
  .ball.dragging::before{
    content:'';
    position:absolute;left:50%;top:50%;
    width:var(--ring-size);height:var(--ring-size);
    margin:calc(var(--ring-size) / -2) 0 0 calc(var(--ring-size) / -2);
    border:1.8px dashed var(--ring-color);
    border-radius:50%;
    opacity:.55;
    pointer-events:none;
  }

  .caret{
    display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:9999px;
    background:#ecfdf5;color:#059669;
    font-size:11px;font-weight:900;line-height:1;
    transition:transform .18s ease, background .18s ease;
    z-index:1;
  }
  .caret.open{transform:rotate(90deg);background:#d1fae5}

  .fold{
    display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:9999px;
    background:#fff;color:#64748b;
    font-size:12px;font-weight:900;line-height:1;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }

  .sec-head{display:flex;align-items:baseline;gap:2px;padding:0 4px;margin-bottom:3px}

  #scrollTrack{
    position:fixed; right:2px; top:50%; transform:translateY(-50%);
    width:8px; height:42vh; border-radius:9999px;
    background:rgba(148,163,184,.18);
    z-index:40;
    touch-action:none;
  }
  #scrollThumb{
    width:8px; border-radius:9999px;
    background:rgba(100,116,139,.65);
    position:absolute; left:0; top:0;
  }

  @keyframes pop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
  .anim-pop{animation:pop .18s ease-out}
  .anim-fade{animation:fadein .16s ease-out}
</style>
</head>
<body class="bg-slate-100 text-slate-900">

<div class="mx-auto w-full max-w-[520px] pb-6">

  <header class="px-3 pt-2 pb-1">
    <div id="headerAll">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-[19px] font-extrabold tracking-tight">开奖号码</h1>
        <div class="flex items-center gap-1">
          <button id="btnColor" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="数字颜色">
            <span id="colorDot" class="w-3.5 h-3.5 rounded-full" style="background:#e11d48"></span>
          </button>
          <button id="btnRing" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="圆圈颜色">
            <span id="ringDot" class="w-3.5 h-3.5 rounded-full" style="border:2px solid #e11d48"></span>
          </button>
          <button id="btnFold" class="fold" aria-label="收起">⌃</button>
          <button id="btnRefresh" class="px-3 py-1.5 rounded-full bg-white text-slate-600 text-[13px] font-medium shadow-sm active:scale-95 transition">刷新</button>
        </div>
      </div>

      <div class="mt-2 grid grid-cols-2 gap-2">
        <button data-game="qxc" class="tab"></button>
        <button data-game="pl5" class="tab"></button>
      </div>

      <div class="mt-1.5 mb-1 flex items-center justify-between gap-2">
        <p id="statusLine" class="text-[10px] text-slate-400 min-h-[13px] truncate"></p>
        <div class="flex items-center gap-1 shrink-0">
          <button id="btnMark" class="h-7 px-2 rounded-full text-[11px] font-semibold shadow-sm transition bg-white text-slate-500">标记</button>
          <button id="btnClear" class="h-7 px-2 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">清除</button>
          <button id="btnTail" class="h-7 px-2 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">
            <span id="tailLabel">7位</span>
          </button>
        </div>
      </div>
    </div>

    <div id="foldBar" class="hidden items-center justify-end gap-1 py-1">
      <button id="btnColor2" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="数字颜色">
        <span id="colorDot2" class="w-3.5 h-3.5 rounded-full" style="background:#e11d48"></span>
      </button>
      <button id="btnRing2" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="圆圈颜色">
        <span id="ringDot2" class="w-3.5 h-3.5 rounded-full" style="border:2px solid #e11d48"></span>
      </button>
      <button id="btnMark2" class="h-7 px-2 rounded-full text-[11px] font-semibold shadow-sm transition bg-white text-slate-500">标记</button>
      <button id="btnClear2" class="h-7 px-2 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">清除</button>
      <button id="btnTail2" class="h-7 px-2 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">
        <span id="tailLabel2">7位</span>
      </button>
      <button id="btnFold2" class="fold" aria-label="展开">⌄</button>
    </div>
  </header>

  <main id="main" class="px-3"></main>

  <p class="px-4 mt-2.5 mb-2 text-[10px] leading-relaxed text-slate-400">
    数据每天 21:00 · 21:30 · 21:50 · 22:00 · 22:40 自动更新（北京时间）。<br>
    最新一期在最下方，其后按 4 期一组补齐空白；点数字加圈，长按拖动连线。
  </p>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-3 z-50 hidden"></div>

<div id="scrollTrack"><div id="scrollThumb"></div></div>

<script>
const NAMES = { qxc: '七星彩', pl5: '排列五' };
const LENS  = { qxc: 7, pl5: 5 };
const BIG_N = 4;
const REMOTE_DATA = 'https://rorykosanke-debug.github.io/qxc/data.json';
const LS_COLOR = 'lottery_color_idx';
const LS_RING  = 'lottery_ring_idx';
const LS_TAIL  = 'lottery_hide_tail';
const LS_MARK  = 'lottery_mark_mode';

const MOVE_TAP = 22;
let lastTouchAt = 0;

const PALETTES = [
  { name:'玫红', bg:'#fff1f2', fg:'#e11d48', dot:'#e11d48' },
  { name:'蓝色', bg:'#eff6ff', fg:'#2563eb', dot:'#2563eb' },
  { name:'绿色', bg:'#ecfdf5', fg:'#059669', dot:'#059669' },
  { name:'紫色', bg:'#f5f3ff', fg:'#7c3aed', dot:'#7c3aed' },
  { name:'橙色', bg:'#fff7ed', fg:'#ea580c', dot:'#ea580c' },
  { name:'金棕', bg:'#fffbeb', fg:'#b45309', dot:'#b45309' }
];

const RING_COLORS = [
  { name:'玫红', c:'#e11d48' },
  { name:'蓝',   c:'#2563eb' },
  { name:'绿',   c:'#059669' },
  { name:'紫',   c:'#7c3aed' },
  { name:'橙',   c:'#ea580c' },
  { name:'金',   c:'#d97706' },
  { name:'黑',   c:'#111827' },
  { name:'灰',   c:'#64748b' }
];

const TAB_ON  = 'tab h-10 rounded-xl font-bold text-[15px] bg-rose-600 text-white shadow-lg shadow-rose-600/25 active:scale-[.98] transition';
const TAB_OFF = 'tab h-10 rounded-xl font-bold text-[15px] bg-white text-slate-500 active:scale-[.98] transition';

const BTN_BASE = 'h-7 px-2 rounded-full text-[11px] font-semibold shadow-sm transition ';
const BTN_OFF  = BTN_BASE + 'bg-white text-slate-500';
const BTN_ON   = BTN_BASE + 'bg-rose-600 text-white';

const STATE = {
  game: 'qxc',
  remote: { qxc: [], pl5: [], updatedAt: null },
  loading: true,
  error: '',
  folded: false,
  expandAll: false,
  hideTail: false,
  markMode: false,
  colorIdx: 0,
  ringIdx: -1,
  circled: new Set(),
  links: []
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 号码球 ---------- */
function ballsHtml(it, mode) {
  const codes = it.codes;
  const shown = STATE.hideTail ? codes.slice(0, BIG_N) : codes;
  const wrap = mode === 'list' ? 'balls list' : 'balls';
  const inner = shown.map((c, i) => {
    let cls = 'ball';
    if (STATE.hideTail) cls += ' zoom';
    else if (i >= BIG_N) cls += ' xs';
    const key = it.issue + ':' + i;
    if (STATE.circled.has(key)) cls += ' circled';
    return `<div class="${cls}" data-cell="${esc(key)}">${esc(c)}</div>`;
  }).join('');
  return `<div class="${wrap}">${inner}</div>`;
}

/* ---------- 空白占位行 ---------- */
function blankRowHtml() {
  const total = LENS[STATE.game];
  const count = STATE.hideTail ? BIG_N : total;
  let cells = '';
  for (let i = 0; i < count; i++) {
    let cls = 'ball blank';
    if (STATE.hideTail) cls += ' zoom';
    else if (i >= BIG_N) cls += ' xs';
    cells += `<div class="${cls}"></div>`;
  }
  return `<div class="relative border-t border-slate-100">
    <div class="px-3.5"><div class="balls list">${cells}</div></div>
  </div>`;
}

/* ---------- 颜色 ---------- */
function applyPalette(idx) {
  const p = PALETTES[idx % PALETTES.length];
  const root = document.documentElement.style;
  root.setProperty('--ball-bg', p.bg);
  root.setProperty('--ball-fg', p.fg);
  const d1 = $('colorDot'), d2 = $('colorDot2');
  if (d1) d1.style.background = p.dot;
  if (d2) d2.style.background = p.dot;
  try { localStorage.setItem(LS_COLOR, String(idx % PALETTES.length)); } catch (e) {}
  applyRing();
}

function ringColor() {
  if (STATE.ringIdx >= 0) return RING_COLORS[STATE.ringIdx % RING_COLORS.length].c;
  return PALETTES[STATE.colorIdx % PALETTES.length].fg;
}

function applyRing() {
  const c = ringColor();
  document.documentElement.style.setProperty('--ring-color', c);
  const r1 = $('ringDot'), r2 = $('ringDot2');
  if (r1) r1.style.borderColor = c;
  if (r2) r2.style.borderColor = c;
  drawLinks();
}

function loadPrefs() {
  let ci = 0, ri = -1;
  try {
    const v = parseInt(localStorage.getItem(LS_COLOR) || '0', 10);
    if (!isNaN(v)) ci = v;
    const r = localStorage.getItem(LS_RING);
    if (r !== null && r !== '') ri = parseInt(r, 10);
    STATE.hideTail = localStorage.getItem(LS_TAIL) === '1';
    STATE.markMode = localStorage.getItem(LS_MARK) === '1';
  } catch (e) {}
  STATE.colorIdx = ci % PALETTES.length;
  STATE.ringIdx = (isNaN(ri) || ri < 0) ? -1 : ri % RING_COLORS.length;
  applyPalette(STATE.colorIdx);
}

function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function nextRing() {
  STATE.ringIdx = (STATE.ringIdx + 1) % RING_COLORS.length;
  savePref(LS_RING, String(STATE.ringIdx));
  applyRing();
  toast('圆圈颜色：' + RING_COLORS[STATE.ringIdx].name);
}

function toCodes(raw, len) {
  let s = Array.isArray(raw) ? raw.join(' ') : String(raw == null ? '' : raw);
  const tokens = s.split(/[\s,，、+]+/).filter(Boolean);
  if (tokens.length === len && tokens.every(t => /^\d$/.test(t))) return tokens;
  const digits = s.replace(/\D/g, '');
  if (digits.length < len) return null;
  return digits.slice(0, len).split('');
}

function listFor(game) {
  return [...STATE.remote[game]].sort((a, b) => (Number(a.issue) || 0) - (Number(b.issue) || 0));
}

const pad = n => String(n).padStart(2, '0');
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.innerHTML = `<div class="anim-pop px-3 py-2 rounded-full bg-slate-900/90 text-white text-[13px] shadow-lg">${esc(msg)}</div>`;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 1500);
}

/* ---------- 连线层 ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
let dragFrom = null, dragX = 0, dragY = 0;

function layer() {
  let s = document.getElementById('linkLayer');
  if (!s) {
    s = document.createElementNS(SVG_NS, 'svg');
    s.id = 'linkLayer';
    s.style.cssText = 'position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:5;overflow:visible';
    document.body.appendChild(s);
  }
  return s;
}

function cellEl(key) { return document.querySelector(`[data-cell="${key}"]`); }

function setCircle(key, on) {
  const el = cellEl(key);
  if (on) {
    STATE.circled.add(key);
    if (el) el.classList.add('circled');
  } else {
    STATE.circled.delete(key);
    if (el) el.classList.remove('circled');
  }
}

function centerDoc(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2 + window.scrollX, y: r.top + r.height / 2 + window.scrollY };
}

function drawLinks() {
  const s = layer();
  s.setAttribute('height', String(document.documentElement.scrollHeight));
  while (s.firstChild) s.removeChild(s.firstChild);

  const color = ringColor();

  const addLine = (p1, p2, dashed) => {
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '2.2');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', dashed ? '0.7' : '0.9');
    if (dashed) line.setAttribute('stroke-dasharray', '6 5');
    s.appendChild(line);
  };

  STATE.links.forEach(l => {
    const a = cellEl(l.a), b = cellEl(l.b);
    if (!a || !b) return;
    addLine(centerDoc(a), centerDoc(b), false);
  });

  if (dragFrom) {
    const a = cellEl(dragFrom);
    if (a) addLine(centerDoc(a), { x: dragX, y: dragY }, true);
  }
}

/* ---------- 交互 ---------- */
const press = {
  key: null, x0: 0, y0: 0,
  moved: false, dragging: false,
  timer: null, wasCircled: false
};

function pressStart(key, x, y) {
  pressReset();
  press.key = key; press.x0 = x; press.y0 = y;
  press.moved = false; press.dragging = false;
  press.wasCircled = STATE.circled.has(key);

  if (!STATE.markMode) return;

  if (!press.wasCircled) setCircle(key, true);

  press.timer = setTimeout(() => {
    if (!press.key || press.moved) return;
    press.dragging = true;
    dragFrom = press.key;
    dragX = press.x0 + window.scrollX;
    dragY = press.y0 + window.scrollY;
    const c = cellEl(press.key);
    if (c) c.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(12);
    drawLinks();
  }, 300);
}

function pressMove(x, y) {
  if (!press.key) return false;
  const dx = x - press.x0, dy = y - press.y0;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (!press.dragging && dist > MOVE_TAP) {
    press.moved = true;
    if (!press.wasCircled) setCircle(press.key, false);
    pressReset();
    return false;
  }
  if (!press.dragging) return false;

  dragX = x + window.scrollX;
  dragY = y + window.scrollY;
  drawLinks();
  return true;
}

function pressEnd(x, y) {
  const wasDragging = press.dragging;
  const from = press.key;
  const wasCircled = press.wasCircled;
  const moved = press.moved;
  clearTimeout(press.timer);

  if (!from) { pressReset(); return; }

  if (wasDragging) {
    const el = document.elementFromPoint(x, y);
    const target = el && el.closest ? el.closest('[data-cell]') : null;
    const toKey = target ? target.dataset.cell : null;
    const srcEl = cellEl(from);
    if (srcEl) srcEl.classList.remove('dragging');

    if (toKey && toKey !== from) {
      const exists = STATE.links.some(l =>
        (l.a === from && l.b === toKey) || (l.a === toKey && l.b === from));
      if (!exists) {
        STATE.links.push({ a: from, b: toKey });
        toast('已连线，共 ' + STATE.links.length + ' 条');
      }
    }
    setCircle(from, true);
  } else if (!moved && STATE.markMode) {
    setCircle(from, !wasCircled);
  }

  dragFrom = null;
  pressReset();
  drawLinks();
}

function pressReset() {
  clearTimeout(press.timer);
  press.key = null;
  press.moved = false;
  press.dragging = false;
}

function keyAtEvent(e) {
  const el = e.target;
  return el && el.closest ? (el.closest('[data-cell]') || null) : null;
}

document.addEventListener('touchstart', e => {
  lastTouchAt = Date.now();
  const cell = keyAtEvent(e);
  if (!cell) return;
  const t = e.touches[0];
  pressStart(cell.dataset.cell, t.clientX, t.clientY);
}, { passive: true });

document.addEventListener('touchmove', e => {
  lastTouchAt = Date.now();
  if (!press.key) return;
  const t = e.touches[0];
  if (pressMove(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', e => {
  lastTouchAt = Date.now();
  if (!press.key) return;
  const t = e.changedTouches[0];
  pressEnd(t.clientX, t.clientY);
}, { passive: true });

document.addEventListener('touchcancel', e => {
  lastTouchAt = Date.now();
  if (press.key) {
    const t = (e.changedTouches && e.changedTouches[0]) || { clientX: press.x0, clientY: press.y0 };
    pressEnd(t.clientX, t.clientY);
  }
  dragFrom = null;
  drawLinks();
}, { passive: true });

function isGhostMouse(e) {
  if (Date.now() - lastTouchAt < 1000) return true;
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return true;
  return false;
}

document.addEventListener('mousedown', e => {
  if (isGhostMouse(e)) return;
  const cell = keyAtEvent(e);
  if (!cell) return;
  pressStart(cell.dataset.cell, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => {
  if (isGhostMouse(e)) return;
  if (press.key) pressMove(e.clientX, e.clientY);
});
document.addEventListener('mouseup', e => {
  if (isGhostMouse(e)) return;
  if (press.key) pressEnd(e.clientX, e.clientY);
});

document.addEventListener('contextmenu', e => {
  if (e.target.closest && e.target.closest('[data-cell],[data-toggle]')) e.preventDefault();
});
document.addEventListener('selectstart', e => {
  if (e.target.closest && e.target.closest('[data-cell]')) e.preventDefault();
});

window.addEventListener('resize', () => { drawLinks(); updateScrollBar(); });

/* ---------- 右侧滑动条 ---------- */
let sbDragging = false;

function updateScrollBar() {
  const track = $('scrollTrack'), thumb = $('scrollThumb');
  if (!track || !thumb) return;

  const docH = document.documentElement.scrollHeight;
  const winH = window.innerHeight;
  if (docH <= winH + 8) { track.style.display = 'none'; return; }
  track.style.display = 'block';

  const trackH = track.clientHeight;
  const ratio = winH / docH;
  const th = Math.max(40, Math.round(trackH * ratio));
  thumb.style.height = th + 'px';

  const maxScroll = docH - winH;
  const top = maxScroll > 0 ? (window.scrollY / maxScroll) * (trackH - th) : 0;
  thumb.style.transform = `translateY(${Math.max(0, Math.min(trackH - th, top))}px)`;
}

function sbJump(clientY) {
  const track = $('scrollTrack'), thumb = $('scrollThumb');
  const rect = track.getBoundingClientRect();
  const trackH = rect.height;
  const th = thumb.offsetHeight;
  let y = clientY - rect.top - th / 2;
  y = Math.max(0, Math.min(trackH - th, y));
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const ratio = (trackH - th) > 0 ? y / (trackH - th) : 0;
  window.scrollTo(0, ratio * maxScroll);
  updateScrollBar();
}

(function initScrollBar() {
  const track = $('scrollTrack');
  if (!track) return;

  track.addEventListener('touchstart', e => {
    sbDragging = true;
    sbJump(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });

  track.addEventListener('touchmove', e => {
    if (!sbDragging) return;
    sbJump(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });

  track.addEventListener('touchend', () => { sbDragging = false; }, { passive: true });
  track.addEventListener('touchcancel', () => { sbDragging = false; }, { passive: true });

  track.addEventListener('mousedown', e => {
    if (isGhostMouse(e)) return;
    sbDragging = true;
    sbJump(e.clientY);
  });
  document.addEventListener('mousemove', e => {
    if (isGhostMouse(e)) return;
    if (sbDragging) sbJump(e.clientY);
  });
  document.addEventListener('mouseup', e => {
    if (isGhostMouse(e)) return;
    sbDragging = false;
  });

  window.addEventListener('scroll', updateScrollBar, { passive: true });
  updateScrollBar();
})();

/* ---------- 单行 ---------- */
function rowHtml(it) {
  const open = STATE.expandAll;
  const info = open
    ? `<div class="anim-fade mb-0.5 text-[10px] leading-tight pl-1">
         <span class="num font-semibold text-slate-500">${esc(it.issue)}</span>
         <span class="num text-slate-300 ml-1">${esc(it.date)}</span>
       </div>`
    : '';

  return `<div class="relative border-t border-slate-100">
    <button data-toggle="1" class="caret absolute left-0.5 top-1/2 -translate-y-1/2 ${open ? 'open' : ''}" aria-label="展开或收起全部">›</button>
    <div class="px-3.5">
      ${info}
      ${ballsHtml(it, 'list')}
    </div>
  </div>`;
}

function render() {
  document.querySelectorAll('.tab').forEach(btn => {
    const on = btn.dataset.game === STATE.game;
    btn.className = on ? TAB_ON : TAB_OFF;
    btn.textContent = NAMES[btn.dataset.game];
  });

  $('headerAll').classList.toggle('hidden', STATE.folded);
  $('foldBar').classList.toggle('hidden', !STATE.folded);
  $('foldBar').classList.toggle('flex', STATE.folded);

  const total = LENS[STATE.game];
  const label = (STATE.hideTail ? BIG_N : total) + '位';
  const l1 = $('tailLabel'), l2 = $('tailLabel2');
  if (l1) l1.textContent = label;
  if (l2) l2.textContent = label;

  ['btnMark', 'btnMark2'].forEach(id => {
    const b = $(id);
    if (!b) return;
    b.className = STATE.markMode ? BTN_ON : BTN_OFF;
    b.textContent = STATE.markMode ? '标记中' : '标记';
  });

  const s = $('statusLine');
  if (STATE.error) {
    s.textContent = STATE.error;
    s.className = 'text-[10px] text-rose-500 min-h-[13px] truncate';
  } else if (STATE.loading && !STATE.remote.updatedAt) {
    s.textContent = '正在获取数据…';
    s.className = 'text-[10px] text-slate-400 min-h-[13px] truncate';
  } else {
    s.textContent = STATE.remote.updatedAt ? '更新于 ' + fmtTime(STATE.remote.updatedAt) : '';
    s.className = 'text-[10px] text-slate-400 min-h-[13px] truncate';
  }

  const main = $('main');
  const list = listFor(STATE.game);

  if (!list.length) {
    main.innerHTML = `<section class="bg-white rounded-2xl p-6 text-center shadow-sm">
      <div class="text-4xl">🎯</div>
      <p class="mt-3 font-semibold">还没有${NAMES[STATE.game]}数据</p>
      <p class="mt-1.5 text-[11px] text-slate-400 leading-relaxed">
        数据每晚 21:00 起自动更新，稍后再刷新看看。
      </p>
    </section>`;
    updateScrollBar();
    return;
  }

  const latest = list[list.length - 1];
  const n = list.length;

  /* 空白行数：4 - (期数 % 4)，所以循环为 4 / 3 / 2 / 1 / 4 … */
  const blanks = 4 - (n % 4);

  const rows = [];
  list.forEach(it => rows.push(rowHtml(it)));
  for (let b = 0; b < blanks; b++) rows.push(blankRowHtml());

  /* 总行数一定是 4 的倍数，每 4 行一条粗线 */
  const html = [];
  rows.forEach((h, i) => {
    html.push(h);
    if ((i + 1) % 4 === 0 && i !== rows.length - 1) {
      html.push('<div class="h-[2.5px] bg-slate-300/80"></div>');
    }
  });

  main.innerHTML = `
  <section class="mt-0.5">
    ${STATE.expandAll
      ? `<div class="sec-head anim-fade">
           <h2 class="text-[13px] font-semibold text-slate-500">开奖记录</h2>
           <span class="text-[10px] text-slate-400 num">共 ${list.length} 期 · 空白 ${blanks}</span>
         </div>`
      : ''}
    <div class="bg-white rounded-xl overflow-hidden shadow-sm">
      ${html.join('')}
    </div>
    <div class="flex items-center justify-center gap-4 mt-1.5">
      <button id="btnCopy" class="text-[10px] text-slate-400 underline">复制最新一期</button>
      <span class="text-[10px] text-slate-300">圈 ${STATE.circled.size} · 线 ${STATE.links.length}</span>
    </div>
  </section>`;

  const copyBtn = $('btnCopy');
  if (copyBtn) copyBtn.onclick = () => copyLatest(latest);

  drawLinks();
  updateScrollBar();
}

async function copyLatest(it) {
  const codes = STATE.hideTail ? it.codes.slice(0, BIG_N) : it.codes;
  const text = `${NAMES[STATE.game]} 第${it.issue}期 ${it.date}\n${codes.join(' ')}`;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  } catch (e) {
    toast('复制失败，请长按选择');
  }
}

async function loadRemote() {
  STATE.loading = true;
  render();
  try {
    const urls = [
      REMOTE_DATA + '?v=' + Date.now(),
      './data.json?v=' + Date.now()
    ];

    let json = null;
    for (const u of urls) {
      try {
        const res = await fetch(u, { cache: 'no-store' });
        if (!res.ok) continue;
        const j = await res.json();
        if (j && (Array.isArray(j.qxc) || Array.isArray(j.pl5))) { json = j; break; }
      } catch (e) {}
    }
    if (!json) throw new Error('无可用数据');

    const remote = { qxc: [], pl5: [], updatedAt: json.updatedAt || null };
    ['qxc', 'pl5'].forEach(k => {
      const arr = Array.isArray(json[k]) ? json[k] : [];
      arr.forEach(it => {
        const codes = toCodes(it.codes ?? it.result ?? it.code ?? it.numbers, LENS[k]);
        const issue = String(it.issue ?? it.qihao ?? '').trim();
        if (!codes || !issue) return;
        remote[k].push({
          issue,
          date: String(it.date ?? '').slice(0, 10),
          codes
        });
      });
    });

    STATE.remote = remote;
    STATE.error = '';
  } catch (e) {
    STATE.error = '暂时连不上数据源';
  } finally {
    STATE.loading = false;
    render();
  }
}

/* ---------- 事件 ---------- */
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    if (STATE.game === b.dataset.game) return;
    STATE.game = b.dataset.game;
    STATE.circled.clear();
    STATE.links = [];
    render();
    window.scrollTo(0, 0);
  };
});

function toggleMarkMode() {
  STATE.markMode = !STATE.markMode;
  savePref(LS_MARK, STATE.markMode ? '1' : '0');
  render();
  toast(STATE.markMode ? '标记已开启：点数字加圈，长按拖线' : '标记已关闭');
}

function toggleTail() {
  STATE.hideTail = !STATE.hideTail;
  savePref(LS_TAIL, STATE.hideTail ? '1' : '0');
  render();
  toast(STATE.hideTail ? '只显示前 4 位' : '显示全部位数');
}

function clearAll() {
  if (!STATE.circled.size && !STATE.links.length) { toast('没有可清除的标记'); return; }
  STATE.circled.clear();
  STATE.links = [];
  render();
  toast('已清除全部圆圈和连线');
}

$('btnMark').onclick = toggleMarkMode;
$('btnMark2').onclick = toggleMarkMode;
$('btnClear').onclick = clearAll;
$('btnClear2').onclick = clearAll;
$('btnTail').onclick = toggleTail;
$('btnTail2').onclick = toggleTail;

function nextColor() {
  STATE.colorIdx = (STATE.colorIdx + 1) % PALETTES.length;
  applyPalette(STATE.colorIdx);
  toast('数字颜色：' + PALETTES[STATE.colorIdx].name);
}
$('btnColor').onclick = nextColor;
$('btnColor2').onclick = nextColor;

$('btnRing').onclick = nextRing;
$('btnRing2').onclick = nextRing;

$('btnFold').onclick = () => { STATE.folded = true; render(); };
$('btnFold2').onclick = () => { STATE.folded = false; render(); };

$('btnRefresh').onclick = () => { toast('正在刷新…'); loadRemote(); };

$('main').addEventListener('click', e => {
  const btn = e.target.closest('[data-toggle]');
  if (!btn) return;
  STATE.expandAll = !STATE.expandAll;
  render();
});

/* ---------- 启动 ---------- */
loadPrefs();
render();
loadRemote();
</script>
</body>
</html>
