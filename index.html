<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f43f5e">
<title>七星彩 · 排列五 开奖号码</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
  .num{font-variant-numeric:tabular-nums}

  :root{
    --ball-bg:#fff1f2;
    --ball-fg:#e11d48;
    --ring-color:#e11d48;
  }

  .balls{display:flex;align-items:center;justify-content:center;gap:4px}

  .ball{
    position:relative;
    flex:0 0 auto;width:13%;
    height:58px;border-radius:14px;
    --ring-size:54px;

    display:flex;align-items:center;justify-content:center;
    background:var(--ball-bg);color:var(--ball-fg);

    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable","Segoe UI","PingFang SC",system-ui,sans-serif;
    font-weight:700;font-size:30px;line-height:1;letter-spacing:0;
    font-variant-numeric:tabular-nums;

    transition:background .18s ease, color .18s ease, width .16s ease, height .16s ease, font-size .16s ease;
    touch-action:manipulation;
  }
  .ball.xs{
    width:6.6%;height:42px;border-radius:9px;
    --ring-size:38px;
    font-size:14px;
  }
  .ball.zoom{
    width:19%;height:64px;border-radius:15px;
    --ring-size:60px;
    font-size:34px;
  }

  /* 正圆标记 */
  .ball.circled::after{
    content:'';
    position:absolute;
    left:50%;top:50%;
    width:var(--ring-size);height:var(--ring-size);
    margin:calc(var(--ring-size) / -2) 0 0 calc(var(--ring-size) / -2);
    border:2.5px solid var(--ring-color);
    border-radius:50%;
    pointer-events:none;
  }
  .ball.dragging{filter:brightness(.96)}
  .ball.dragging::before{
    content:'';
    position:absolute;left:50%;top:50%;
    width:var(--ring-size);height:var(--ring-size);
    margin:calc(var(--ring-size) / -2) 0 0 calc(var(--ring-size) / -2);
    border:2px dashed var(--ring-color);
    border-radius:50%;
    opacity:.55;
    pointer-events:none;
  }

  .caret{
    display:flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:9999px;
    background:#ecfdf5;color:#059669;
    font-size:12px;font-weight:900;line-height:1;
    transition:transform .18s ease, background .18s ease;
    z-index:1;
  }
  .caret.open{transform:rotate(90deg);background:#d1fae5}

  .fold{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9999px;
    background:#fff;color:#64748b;
    font-size:13px;font-weight:900;line-height:1;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }

  .sec-head{display:flex;align-items:baseline;gap:2px;padding:0 4px;margin-bottom:4px}

  @keyframes pop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
  .anim-pop{animation:pop .18s ease-out}
  .anim-fade{animation:fadein .16s ease-out}
  input{font-family:inherit}
</style>
</head>
<body class="bg-slate-100 text-slate-900">

<div class="mx-auto w-full max-w-[520px] pb-10">

  <header class="px-4 pt-3 pb-1">
    <div id="headerAll">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-[22px] font-extrabold tracking-tight">开奖号码</h1>
        <div class="flex items-center gap-1.5">
          <button id="btnColor" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="数字颜色">
            <span id="colorDot" class="w-4 h-4 rounded-full" style="background:#e11d48"></span>
          </button>
          <button id="btnRing" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="圆圈颜色">
            <span id="ringDot" class="w-4 h-4 rounded-full" style="border:2.5px solid #e11d48"></span>
          </button>
          <button id="btnTail" class="h-8 px-3 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">
            <span id="tailLabel">7位</span>
          </button>
          <button id="btnFold" class="fold" aria-label="收起">⌃</button>
          <button id="btnRefresh" class="px-4 py-2 rounded-full bg-white text-slate-600 text-sm font-medium shadow-sm active:scale-95 transition">刷新</button>
        </div>
      </div>

      <div class="mt-3 grid grid-cols-2 gap-2.5">
        <button data-game="qxc" class="tab"></button>
        <button data-game="pl5" class="tab"></button>
      </div>

      <p id="statusLine" class="mt-2 mb-1.5 text-[11px] text-slate-400 min-h-[15px]"></p>
    </div>

    <div id="foldBar" class="hidden items-center justify-end gap-1.5 py-1">
      <button id="btnColor2" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="数字颜色">
        <span id="colorDot2" class="w-3.5 h-3.5 rounded-full" style="background:#e11d48"></span>
      </button>
      <button id="btnRing2" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="圆圈颜色">
        <span id="ringDot2" class="w-3.5 h-3.5 rounded-full" style="border:2px solid #e11d48"></span>
      </button>
      <button id="btnTail2" class="h-8 px-2.5 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">
        <span id="tailLabel2">7位</span>
      </button>
      <button id="btnFold2" class="fold" aria-label="展开">⌄</button>
    </div>
  </header>

  <main id="main" class="px-4"></main>

  <p class="px-5 mt-4 mb-4 text-[11px] leading-relaxed text-slate-400">
    数据每天 21:00 · 21:30 · 21:50 · 22:00 · 22:40 自动更新（北京时间）。<br>
    点数字出圆圈；长按数字拖到另一个数字上可连线。
  </p>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-4 z-50 hidden"></div>

<script>
const NAMES = { qxc: '七星彩', pl5: '排列五' };
const LENS  = { qxc: 7, pl5: 5 };
const BIG_N = 4;
const REMOTE_DATA = 'https://rorykosanke-debug.github.io/qxc/data.json';
const LS_COLOR = 'lottery_color_idx';
const LS_RING  = 'lottery_ring_idx';
const LS_TAIL  = 'lottery_hide_tail';

const PALETTES = [
  { name:'玫红', bg:'#fff1f2', fg:'#e11d48', dot:'#e11d48' },
  { name:'蓝色', bg:'#eff6ff', fg:'#2563eb', dot:'#2563eb' },
  { name:'绿色', bg:'#ecfdf5', fg:'#059669', dot:'#059669' },
  { name:'紫色', bg:'#f5f3ff', fg:'#7c3aed', dot:'#7c3aed' },
  { name:'橙色', bg:'#fff7ed', fg:'#ea580c', dot:'#ea580c' },
  { name:'金棕', bg:'#fffbeb', fg:'#b45309', dot:'#b45309' }
];

const RING_COLORS = [
  { name:'玫红', c:'#e11d48' },
  { name:'蓝',   c:'#2563eb' },
  { name:'绿',   c:'#059669' },
  { name:'紫',   c:'#7c3aed' },
  { name:'橙',   c:'#ea580c' },
  { name:'金',   c:'#d97706' },
  { name:'黑',   c:'#111827' },
  { name:'灰',   c:'#64748b' }
];

const TAB_ON  = 'tab h-12 rounded-2xl font-bold text-base bg-rose-600 text-white shadow-lg shadow-rose-600/25 active:scale-[.98] transition';
const TAB_OFF = 'tab h-12 rounded-2xl font-bold text-base bg-white text-slate-500 active:scale-[.98] transition';

const STATE = {
  game: 'qxc',
  remote: { qxc: [], pl5: [], updatedAt: null },
  loading: true,
  error: '',
  folded: false,
  expandAll: false,
  hideTail: false,
  colorIdx: 0,
  ringIdx: -1,          // -1 表示跟随数字颜色
  circled: new Set(),
  links: []
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 号码球 ---------- */
function ballsHtml(it, mode) {
  const codes = it.codes;
  const shown = STATE.hideTail ? codes.slice(0, BIG_N) : codes;
  const wrap = mode === 'list' ? 'balls list' : 'balls';
  const inner = shown.map((c, i) => {
    let cls = 'ball';
    if (STATE.hideTail) cls += ' zoom';
    else if (i >= BIG_N) cls += ' xs';
    const key = it.issue + ':' + i;
    if (STATE.circled.has(key)) cls += ' circled';
    return `<div class="${cls}" data-cell="${esc(key)}">${esc(c)}</div>`;
  }).join('');
  return `<div class="${wrap}">${inner}</div>`;
}

/* ---------- 配色 ---------- */
function applyPalette(idx) {
  const p = PALETTES[idx % PALETTES.length];
  const root = document.documentElement.style;
  root.setProperty('--ball-bg', p.bg);
  root.setProperty('--ball-fg', p.fg);
  const d1 = $('colorDot'), d2 = $('colorDot2');
  if (d1) d1.style.background = p.dot;
  if (d2) d2.style.background = p.dot;
  try { localStorage.setItem(LS_COLOR, String(idx % PALETTES.length)); } catch (e) {}
  applyRing();
}

function ringColor() {
  if (STATE.ringIdx >= 0) return RING_COLORS[STATE.ringIdx % RING_COLORS.length].c;
  return PALETTES[STATE.colorIdx % PALETTES.length].fg;   // 未指定时跟随数字颜色
}

function applyRing() {
  const c = ringColor();
  document.documentElement.style.setProperty('--ring-color', c);
  const r1 = $('ringDot'), r2 = $('ringDot2');
  if (r1) r1.style.borderColor = c;
  if (r2) r2.style.borderColor = c;
  drawLinks();
}

function loadColors() {
  let ci = 0, ri = -1;
  try {
    const v = parseInt(localStorage.getItem(LS_COLOR) || '0', 10);
    if (!isNaN(v)) ci = v;
    const r = localStorage.getItem(LS_RING);
    if (r !== null && r !== '') ri = parseInt(r, 10);
  } catch (e) {}
  STATE.colorIdx = ci % PALETTES.length;
  STATE.ringIdx = (ri === undefined || isNaN(ri)) ? -1 : (ri < 0 ? -1 : ri % RING_COLORS.length);
  applyPalette(STATE.colorIdx);
}

function nextRing() {
  STATE.ringIdx = (STATE.ringIdx + 1) % RING_COLORS.length;
  try { localStorage.setItem(LS_RING, String(STATE.ringIdx)); } catch (e) {}
  applyRing();
  toast('圆圈颜色：' + RING_COLORS[STATE.ringIdx].name);
}

function loadTail() {
  try { STATE.hideTail = localStorage.getItem(LS_TAIL) === '1'; } catch (e) {}
}
function saveTail() {
  try { localStorage.setItem(LS_TAIL, STATE.hideTail ? '1' : '0'); } catch (e) {}
}

/* ---------- 号码解析 ---------- */
function toCodes(raw, len) {
  let s = Array.isArray(raw) ? raw.join(' ') : String(raw == null ? '' : raw);
  const tokens = s.split(/[\s,，、+]+/).filter(Boolean);
  if (tokens.length === len && tokens.every(t => /^\d$/.test(t))) return tokens;
  const digits = s.replace(/\D/g, '');
  if (digits.length < len) return null;
  return digits.slice(0, len).split('');
}

function listFor(game) {
  return [...STATE.remote[game]].sort((a, b) => (Number(b.issue) || 0) - (Number(a.issue) || 0));
}

const pad = n => String(n).padStart(2, '0');
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.innerHTML = `<div class="anim-pop px-4 py-2.5 rounded-full bg-slate-900/90 text-white text-sm shadow-lg">${esc(msg)}</div>`;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 1600);
}

/* ---------- 连线层 ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
let dragFrom = null, dragX = 0, dragY = 0;

function layer() {
  let s = document.getElementById('linkLayer');
  if (!s) {
    s = document.createElementNS(SVG_NS, 'svg');
    s.id = 'linkLayer';
    s.style.cssText = 'position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:5;overflow:visible';
    document.body.appendChild(s);
  }
  return s;
}

function cellEl(key) {
  return document.querySelector(`[data-cell="${key}"]`);
}

function centerDoc(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2 + window.scrollX, y: r.top + r.height / 2 + window.scrollY };
}

function drawLinks() {
  const s = layer();
  s.setAttribute('height', String(document.documentElement.scrollHeight));
  while (s.firstChild) s.removeChild(s.firstChild);

  const color = ringColor();

  const addLine = (p1, p2, dashed) => {
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '2.5');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', dashed ? '0.7' : '0.9');
    if (dashed) line.setAttribute('stroke-dasharray', '6 5');
    s.appendChild(line);
  };

  STATE.links.forEach(l => {
    const a = cellEl(l.a), b = cellEl(l.b);
    if (!a || !b) return;
    addLine(centerDoc(a), centerDoc(b), false);
  });

  if (dragFrom) {
    const a = cellEl(dragFrom);
    if (a) addLine(centerDoc(a), { x: dragX, y: dragY }, true);
  }
}

/* ---------- 点击加圈 / 长按连线 ---------- */
const press = { key: null, x0: 0, y0: 0, moved: false, dragging: false, timer: null };

function pressStart(key, x, y) {
  pressReset();
  press.key = key; press.x0 = x; press.y0 = y;
  press.moved = false; press.dragging = false;
  press.timer = setTimeout(() => {
    if (!press.key) return;
    press.dragging = true;
    dragFrom = press.key;
    dragX = press.x0 + window.scrollX;
    dragY = press.y0 + window.scrollY;
    const el = cellEl(press.key);
    if (el) el.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(12);
    drawLinks();
  }, 300);
}

function pressMove(x, y) {
  if (!press.key) return false;
  const dx = x - press.x0, dy = y - press.y0;
  if (Math.sqrt(dx * dx + dy * dy) > 8) press.moved = true;

  if (!press.dragging) {
    if (press.moved) pressReset();
    return false;
  }
  dragX = x + window.scrollX;
  dragY = y + window.scrollY;
  drawLinks();
  return true;
}

function pressEnd(x, y) {
  const wasDragging = press.dragging;
  const from = press.key;
  clearTimeout(press.timer);

  if (wasDragging && from) {
    const el = document.elementFromPoint(x, y);
    const target = el && el.closest ? el.closest('[data-cell]') : null;
    const toKey = target ? target.dataset.cell : null;
    const srcEl = cellEl(from);
    if (srcEl) srcEl.classList.remove('dragging');

    if (toKey && toKey !== from) {
      const exists = STATE.links.some(l =>
        (l.a === from && l.b === toKey) || (l.a === toKey && l.b === from));
      if (!exists) {
        STATE.links.push({ a: from, b: toKey });
        toast('已连线，共 ' + STATE.links.length + ' 条');
      }
    }
  } else if (from && !press.moved) {
    if (STATE.circled.has(from)) STATE.circled.delete(from);
    else STATE.circled.add(from);
    render();
  }

  dragFrom = null;
  pressReset();
  drawLinks();
}

function pressReset() {
  clearTimeout(press.timer);
  press.key = null;
  press.moved = false;
  press.dragging = false;
}

function keyAtEvent(e) {
  const el = e.target;
  return el && el.closest ? (el.closest('[data-cell]') || null) : null;
}

document.addEventListener('touchstart', e => {
  const cell = keyAtEvent(e);
  if (!cell) return;
  const t = e.touches[0];
  pressStart(cell.dataset.cell, t.clientX, t.clientY);
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!press.key) return;
  const t = e.touches[0];
  if (pressMove(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', e => {
  if (!press.key) return;
  const t = e.changedTouches[0];
  pressEnd(t.clientX, t.clientY);
}, { passive: true });

document.addEventListener('touchcancel', () => {
  dragFrom = null;
  pressReset();
  drawLinks();
}, { passive: true });

document.addEventListener('mousedown', e => {
  const cell = keyAtEvent(e);
  if (!cell) return;
  pressStart(cell.dataset.cell, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { if (press.key) pressMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', e => { if (press.key) pressEnd(e.clientX, e.clientY); });

window.addEventListener('resize', () => drawLinks());

/* ---------- 历史行 ---------- */
function rowHtml(it) {
  const open = STATE.expandAll;
  const info = open
    ? `<div class="anim-fade mb-0.5 text-[11px] leading-tight pl-1">
         <span class="num font-semibold text-slate-500">${esc(it.issue)}</span>
         <span class="num text-slate-300 ml-1">${esc(it.date)}</span>
       </div>`
    : '';

  return `<div class="relative border-t border-slate-100">
    <button data-toggle="1" class="caret absolute left-1 top-1/2 -translate-y-1/2 ${open ? 'open' : ''}" aria-label="展开或收起全部">›</button>
    <div class="px-4">
      ${info}
      ${ballsHtml(it, 'list')}
    </div>
  </div>`;
}

function render() {
  document.querySelectorAll('.tab').forEach(btn => {
    const on = btn.dataset.game === STATE.game;
    btn.className = on ? TAB_ON : TAB_OFF;
    btn.textContent = NAMES[btn.dataset.game];
  });

  $('headerAll').classList.toggle('hidden', STATE.folded);
  $('foldBar').classList.toggle('hidden', !STATE.folded);
  $('foldBar').classList.toggle('flex', STATE.folded);

  const total = LENS[STATE.game];
  const label = (STATE.hideTail ? BIG_N : total) + '位';
  const l1 = $('tailLabel'), l2 = $('tailLabel2');
  if (l1) l1.textContent = label;
  if (l2) l2.textContent = label;

  const s = $('statusLine');
  if (STATE.error) {
    s.textContent = STATE.error;
    s.className = 'mt-2 mb-1.5 text-[11px] text-rose-500 min-h-[15px]';
  } else if (STATE.loading && !STATE.remote.updatedAt) {
    s.textContent = '正在获取数据…';
    s.className = 'mt-2 mb-1.5 text-[11px] text-slate-400 min-h-[15px]';
  } else {
    s.textContent = STATE.remote.updatedAt ? '数据更新于 ' + fmtTime(STATE.remote.updatedAt) : '';
    s.className = 'mt-2 mb-1.5 text-[11px] text-slate-400 min-h-[15px]';
  }

  const main = $('main');
  const list = listFor(STATE.game);

  if (!list.length) {
    main.innerHTML = `<section class="bg-white rounded-3xl p-6 text-center shadow-sm">
      <div class="text-4xl">🎯</div>
      <p class="mt-3 font-semibold">还没有${NAMES[STATE.game]}数据</p>
      <p class="mt-1.5 text-[11px] text-slate-400 leading-relaxed">
        数据每晚 21:00 起自动更新，稍后再刷新看看。
      </p>
    </section>`;
    return;
  }

  const latest = list[0];
  const rest = list.slice(1);

  const rows = [];
  rest.forEach((it, i) => {
    rows.push(rowHtml(it));
    if ((i + 1) % 4 === 0 && i !== rest.length - 1) {
      rows.push('<div class="h-[3px] bg-slate-300/80"></div>');
    }
  });

  main.innerHTML = `
  <section class="bg-white rounded-3xl px-3 py-2.5 shadow-sm">
    <div class="flex items-center justify-between">
      <span class="text-[11px] text-slate-400">最新一期</span>
      <button id="btnCopy" class="px-3 py-1 rounded-full bg-slate-100 text-slate-500 text-xs font-medium active:scale-95 transition">复制</button>
    </div>
    <div class="mt-1.5">${ballsHtml(latest, 'latest')}</div>
  </section>

  <section class="mt-2.5">
    ${STATE.expandAll
      ? `<div class="sec-head anim-fade">
           <h2 class="text-sm font-semibold text-slate-500">历史开奖</h2>
           <span class="text-[11px] text-slate-400 num">共 ${list.length} 期</span>
         </div>`
      : ''}
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
      ${rows.length
        ? rows.join('')
        : `<div class="py-10 text-center text-sm text-slate-400">暂无更多历史</div>`}
    </div>
    ${STATE.links.length
      ? `<button id="btnClearLinks" class="mt-2 mx-auto block text-[11px] text-slate-400 underline">清除连线（${STATE.links.length}）</button>`
      : ''}
  </section>`;

  const copyBtn = $('btnCopy');
  if (copyBtn) copyBtn.onclick = () => copyLatest(latest);

  const clearBtn = $('btnClearLinks');
  if (clearBtn) clearBtn.onclick = () => {
    STATE.links = [];
    render();
    toast('连线已清除');
  };

  drawLinks();
}

async function copyLatest(it) {
  const codes = STATE.hideTail ? it.codes.slice(0, BIG_N) : it.codes;
  const text = `${NAMES[STATE.game]} 第${it.issue}期 ${it.date}\n${codes.join(' ')}`;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  } catch (e) {
    toast('复制失败，请长按选择');
  }
}

async function loadRemote() {
  STATE.loading = true;
  render();
  try {
    const urls = [
      REMOTE_DATA + '?v=' + Date.now(),
      './data.json?v=' + Date.now()
    ];

    let json = null;
    for (const u of urls) {
      try {
        const res = await fetch(u, { cache: 'no-store' });
        if (!res.ok) continue;
        const j = await res.json();
        if (j && (Array.isArray(j.qxc) || Array.isArray(j.pl5))) { json = j; break; }
      } catch (e) {}
    }
    if (!json) throw new Error('无可用数据');

    const remote = { qxc: [], pl5: [], updatedAt: json.updatedAt || null };
    ['qxc', 'pl5'].forEach(k => {
      const arr = Array.isArray(json[k]) ? json[k] : [];
      arr.forEach(it => {
        const codes = toCodes(it.codes ?? it.result ?? it.code ?? it.numbers, LENS[k]);
        const issue = String(it.issue ?? it.qihao ?? '').trim();
        if (!codes || !issue) return;
        remote[k].push({
          issue,
          date: String(it.date ?? '').slice(0, 10),
          codes
        });
      });
    });

    STATE.remote = remote;
    STATE.error = '';
  } catch (e) {
    STATE.error = '暂时连不上数据源';
  } finally {
    STATE.loading = false;
    render();
  }
}

/* ---------- 事件 ---------- */
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    if (STATE.game === b.dataset.game) return;
    STATE.game = b.dataset.game;
    STATE.circled.clear();
    STATE.links = [];
    render();
  };
});

function toggleTail() {
  STATE.hideTail = !STATE.hideTail;
  saveTail();
  render();
  toast(STATE.hideTail ? '只显示前 4 位' : '显示全部位数');
}

$('btnTail').onclick = toggleTail;
$('btnTail2').onclick = toggleTail;

function nextColor() {
  STATE.colorIdx = (STATE.colorIdx + 1) % PALETTES.length;
  applyPalette(STATE.colorIdx);
  toast('数字颜色：' + PALETTES[STATE.colorIdx].name);
}
$('btnColor').onclick = nextColor;
$('btnColor2').onclick = nextColor;

$('btnRing').onclick = nextRing;
$('btnRing2').onclick = nextRing;

$('btnFold').onclick = () => { STATE.folded = true; render(); };
$('btnFold2').onclick = () => { STATE.folded = false; render(); };

$('btnRefresh').onclick = () => { toast('正在刷新…'); loadRemote(); };

$('main').addEventListener('click', e => {
  const btn = e.target.closest('[data-toggle]');
  if (!btn) return;
  STATE.expandAll = !STATE.expandAll;
  render();
});

/* ---------- 启动 ---------- */
loadColors();
loadTail();
render();
loadRemote();
</script>
</body>
</html>
