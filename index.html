<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f43f5e">
<title>七星彩 · 排列五 开奖号码</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
  .num{font-variant-numeric:tabular-nums}

  :root{
    --ball-bg:#fff1f2;
    --ball-fg:#e11d48;
    --ball-bg-sm:#fff5f6;
    --ball-fg-sm:#f43f5e;
  }

  .balls{display:flex;align-items:center;justify-content:center;gap:4px}
  .balls.list{gap:4px}

  /* 前 4 位：大号（最新一期与历史共用，保证上下对齐） */
  .ball{
    flex:0 0 auto;width:13%;
    height:74px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:var(--ball-bg);color:var(--ball-fg);
    font-weight:800;font-size:36px;line-height:1;letter-spacing:-0.5px;
    transition:background .18s ease, color .18s ease, width .16s ease, height .16s ease, font-size .16s ease;
  }
  /* 第 5 位起：小号、更窄 */
  .ball.xs{
    width:6.8%;height:54px;border-radius:11px;
    font-size:17px;letter-spacing:0;
  }
  /* 隐藏后 4 位时：前 4 位放大并居中 */
  .ball.zoom{
    width:21%;height:88px;border-radius:18px;font-size:48px;
  }

  .caret{
    display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:9999px;
    background:#ecfdf5;color:#059669;
    font-size:13px;font-weight:900;line-height:1;
    transition:transform .18s ease, background .18s ease;
    z-index:1;
  }
  .caret.open{transform:rotate(90deg);background:#d1fae5}

  .fold{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9999px;
    background:#fff;color:#64748b;
    font-size:13px;font-weight:900;line-height:1;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }

  .sec-head{display:flex;align-items:baseline;gap:2px;padding:0 4px;margin-bottom:6px}

  @keyframes pop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
  .anim-pop{animation:pop .18s ease-out}
  .anim-fade{animation:fadein .16s ease-out}
  input{font-family:inherit}
</style>
</head>
<body class="bg-slate-100 text-slate-900">

<div class="mx-auto w-full max-w-[520px] pb-10">

  <header class="px-4 pt-3 pb-1">
    <div id="headerAll">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-[22px] font-extrabold tracking-tight">开奖号码</h1>
        <div class="flex items-center gap-1.5">
          <button id="btnColor" class="w-9 h-9 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="切换数字颜色">
            <span id="colorDot" class="w-4 h-4 rounded-full transition-colors" style="background:#e11d48"></span>
          </button>
          <button id="btnTail" class="h-9 px-3 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">
            <span id="tailLabel">7位</span>
          </button>
          <button id="btnFold" class="fold" aria-label="收起">⌃</button>
          <button id="btnRefresh" class="px-4 py-2 rounded-full bg-white text-slate-600 text-sm font-medium shadow-sm active:scale-95 transition">刷新</button>
        </div>
      </div>

      <div class="mt-3 grid grid-cols-2 gap-2.5">
        <button data-game="qxc" class="tab"></button>
        <button data-game="pl5" class="tab"></button>
      </div>

      <p id="statusLine" class="mt-2 mb-2 text-[11px] text-slate-400 min-h-[15px]"></p>
    </div>

    <div id="foldBar" class="hidden items-center justify-end gap-1.5 py-1">
      <button id="btnColor2" class="w-8 h-8 rounded-full bg-white shadow-sm active:scale-95 transition flex items-center justify-center" aria-label="切换数字颜色">
        <span id="colorDot2" class="w-3.5 h-3.5 rounded-full" style="background:#e11d48"></span>
      </button>
      <button id="btnTail2" class="h-8 px-2.5 rounded-full bg-white text-slate-600 text-[11px] font-semibold shadow-sm active:scale-95 transition">
        <span id="tailLabel2">7位</span>
      </button>
      <button id="btnFold2" class="fold" aria-label="展开">⌄</button>
    </div>
  </header>

  <main id="main" class="px-4"></main>

  <p class="px-5 mt-5 mb-4 text-[11px] leading-relaxed text-slate-400">
    数据每天 21:00 · 21:50 · 22:00 · 22:40 自动更新（北京时间）。<br>
    点历史列表中任意绿色箭头，可整体展开期号与开奖日期。
  </p>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-4 z-50 hidden"></div>

<script>
const NAMES = { qxc: '七星彩', pl5: '排列五' };
const LENS  = { qxc: 7, pl5: 5 };
const BIG_N = 4;
const REMOTE_DATA = 'https://rorykosanke-debug.github.io/qxc/data.json';
const LS_COLOR = 'lottery_color_idx';
const LS_TAIL  = 'lottery_hide_tail';

const PALETTES = [
  { name:'玫红', bg:'#fff1f2', fg:'#e11d48', bgSm:'#fff5f6', fgSm:'#f43f5e', dot:'#e11d48' },
  { name:'蓝色', bg:'#eff6ff', fg:'#2563eb', bgSm:'#f5f9ff', fgSm:'#3b82f6', dot:'#2563eb' },
  { name:'绿色', bg:'#ecfdf5', fg:'#059669', bgSm:'#f3fdf9', fgSm:'#10b981', dot:'#059669' },
  { name:'紫色', bg:'#f5f3ff', fg:'#7c3aed', bgSm:'#f8f6ff', fgSm:'#8b5cf6', dot:'#7c3aed' },
  { name:'橙色', bg:'#fff7ed', fg:'#ea580c', bgSm:'#fffaf3', fgSm:'#f97316', dot:'#ea580c' },
  { name:'金棕', bg:'#fffbeb', fg:'#b45309', bgSm:'#fffdf5', fgSm:'#d97706', dot:'#b45309' }
];

const TAB_ON  = 'tab h-12 rounded-2xl font-bold text-base bg-rose-600 text-white shadow-lg shadow-rose-600/25 active:scale-[.98] transition';
const TAB_OFF = 'tab h-12 rounded-2xl font-bold text-base bg-white text-slate-500 active:scale-[.98] transition';

const STATE = {
  game: 'qxc',
  remote: { qxc: [], pl5: [], updatedAt: null },
  loading: true,
  error: '',
  folded: false,
  expandAll: false,
  hideTail: false,
  colorIdx: 0
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 号码球：hidden 时只显示前 4 位并放大 */
function ballsHtml(codes, mode) {
  const shown = STATE.hideTail ? codes.slice(0, BIG_N) : codes;
  const wrap = mode === 'list' ? 'balls list' : 'balls';
  const inner = shown.map((c, i) => {
    let cls = 'ball';
    if (STATE.hideTail) cls += ' zoom';
    else if (i >= BIG_N) cls += ' xs';
    return `<div class="${cls}">${esc(c)}</div>`;
  }).join('');
  return `<div class="${wrap}">${inner}</div>`;
}

/* ---------- 配色 ---------- */
function applyPalette(idx) {
  const p = PALETTES[idx % PALETTES.length];
  const root = document.documentElement.style;
  root.setProperty('--ball-bg', p.bg);
  root.setProperty('--ball-fg', p.fg);
  root.setProperty('--ball-bg-sm', p.bgSm);
  root.setProperty('--ball-fg-sm', p.fgSm);
  const d1 = $('colorDot'), d2 = $('colorDot2');
  if (d1) d1.style.background = p.dot;
  if (d2) d2.style.background = p.dot;
  try { localStorage.setItem(LS_COLOR, String(idx % PALETTES.length)); } catch (e) {}
}
function loadPalette() {
  let idx = 0;
  try {
    const v = parseInt(localStorage.getItem(LS_COLOR) || '0', 10);
    if (!isNaN(v)) idx = v;
  } catch (e) {}
  STATE.colorIdx = idx % PALETTES.length;
  applyPalette(STATE.colorIdx);
}

/* ---------- 位数开关 ---------- */
function loadTail() {
  try { STATE.hideTail = localStorage.getItem(LS_TAIL) === '1'; } catch (e) {}
}
function saveTail() {
  try { localStorage.setItem(LS_TAIL, STATE.hideTail ? '1' : '0'); } catch (e) {}
}

/* ---------- 号码解析 ---------- */
function toCodes(raw, len) {
  let s = Array.isArray(raw) ? raw.join(' ') : String(raw == null ? '' : raw);
  const tokens = s.split(/[\s,，、+]+/).filter(Boolean);
  if (tokens.length === len && tokens.every(t => /^\d$/.test(t))) return tokens;
  const digits = s.replace(/\D/g, '');
  if (digits.length < len) return null;
  return digits.slice(0, len).split('');
}

function listFor(game) {
  return [...STATE.remote[game]].sort((a, b) => (Number(b.issue) || 0) - (Number(a.issue) || 0));
}

const pad = n => String(n).padStart(2, '0');
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.innerHTML = `<div class="anim-pop px-4 py-2.5 rounded-full bg-slate-900/90 text-white text-sm shadow-lg">${esc(msg)}</div>`;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 1600);
}

/* ---------- 历史行：箭头绝对定位，保证与最新一期左右对齐 ---------- */
function rowHtml(it) {
  const open = STATE.expandAll;
  const info = open
    ? `<div class="anim-fade mb-0.5 text-[11px] leading-tight pl-1">
         <span class="num font-semibold text-slate-500">${esc(it.issue)}</span>
         <span class="num text-slate-300 ml-1">${esc(it.date)}</span>
       </div>`
    : '';

  return `<div class="relative border-t border-slate-100">
    <button data-toggle="1" class="caret absolute left-1 top-1/2 -translate-y-1/2 ${open ? 'open' : ''}" aria-label="展开或收起全部">›</button>
    <div class="px-4 py-1">
      ${info}
      ${ballsHtml(it.codes, 'list')}
    </div>
  </div>`;
}

function render() {
  document.querySelectorAll('.tab').forEach(btn => {
    const on = btn.dataset.game === STATE.game;
    btn.className = on ? TAB_ON : TAB_OFF;
    btn.textContent = NAMES[btn.dataset.game];
  });

  $('headerAll').classList.toggle('hidden', STATE.folded);
  $('foldBar').classList.toggle('hidden', !STATE.folded);
  $('foldBar').classList.toggle('flex', STATE.folded);

  const total = LENS[STATE.game];
  const label = (STATE.hideTail ? BIG_N : total) + '位';
  const l1 = $('tailLabel'), l2 = $('tailLabel2');
  if (l1) l1.textContent = label;
  if (l2) l2.textContent = label;

  const s = $('statusLine');
  if (STATE.error) {
    s.textContent = STATE.error;
    s.className = 'mt-2 mb-2 text-[11px] text-rose-500 min-h-[15px]';
  } else if (STATE.loading && !STATE.remote.updatedAt) {
    s.textContent = '正在获取数据…';
    s.className = 'mt-2 mb-2 text-[11px] text-slate-400 min-h-[15px]';
  } else {
    s.textContent = STATE.remote.updatedAt ? '数据更新于 ' + fmtTime(STATE.remote.updatedAt) : '';
    s.className = 'mt-2 mb-2 text-[11px] text-slate-400 min-h-[15px]';
  }

  const main = $('main');
  const list = listFor(STATE.game);

  if (!list.length) {
    main.innerHTML = `<section class="bg-white rounded-3xl p-6 text-center shadow-sm">
      <div class="text-4xl">🎯</div>
      <p class="mt-3 font-semibold">还没有${NAMES[STATE.game]}数据</p>
      <p class="mt-1.5 text-[11px] text-slate-400 leading-relaxed">
        数据每晚 21:00 起自动更新，稍后再刷新看看。
      </p>
    </section>`;
    return;
  }

  const latest = list[0];
  const rest = list.slice(1);

  main.innerHTML = `
  <section class="bg-white rounded-3xl p-4 shadow-sm">
    <div class="flex items-center justify-between">
      <span class="text-[11px] text-slate-400">最新一期</span>
      <button id="btnCopy" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-500 text-xs font-medium active:scale-95 transition">复制</button>
    </div>
    <div class="mt-2.5">${ballsHtml(latest.codes, 'latest')}</div>
  </section>

  <section class="mt-3">
    ${STATE.expandAll
      ? `<div class="sec-head anim-fade">
           <h2 class="text-sm font-semibold text-slate-500">历史开奖</h2>
           <span class="text-[11px] text-slate-400 num">共 ${list.length} 期</span>
         </div>`
      : ''}
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
      ${rest.length
        ? rest.map(rowHtml).join('')
        : `<div class="py-10 text-center text-sm text-slate-400">暂无更多历史</div>`}
    </div>
  </section>`;

  const copyBtn = $('btnCopy');
  if (copyBtn) copyBtn.onclick = () => copyLatest(latest);
}

async function copyLatest(it) {
  const codes = STATE.hideTail ? it.codes.slice(0, BIG_N) : it.codes;
  const text = `${NAMES[STATE.game]} 第${it.issue}期 ${it.date}\n${codes.join(' ')}`;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  } catch (e) {
    toast('复制失败，请长按选择');
  }
}

async function loadRemote() {
  STATE.loading = true;
  render();
  try {
    const urls = [
      REMOTE_DATA + '?v=' + Date.now(),
      './data.json?v=' + Date.now()
    ];

    let json = null;
    for (const u of urls) {
      try {
        const res = await fetch(u, { cache: 'no-store' });
        if (!res.ok) continue;
        const j = await res.json();
        if (j && (Array.isArray(j.qxc) || Array.isArray(j.pl5))) { json = j; break; }
      } catch (e) {}
    }
    if (!json) throw new Error('无可用数据');

    const remote = { qxc: [], pl5: [], updatedAt: json.updatedAt || null };
    ['qxc', 'pl5'].forEach(k => {
      const arr = Array.isArray(json[k]) ? json[k] : [];
      arr.forEach(it => {
        const codes = toCodes(it.codes ?? it.result ?? it.code ?? it.numbers, LENS[k]);
        const issue = String(it.issue ?? it.qihao ?? '').trim();
        if (!codes || !issue) return;
        remote[k].push({
          issue,
          date: String(it.date ?? '').slice(0, 10),
          codes
        });
      });
    });

    STATE.remote = remote;
    STATE.error = '';
  } catch (e) {
    STATE.error = '暂时连不上数据源';
  } finally {
    STATE.loading = false;
    render();
  }
}

/* ---------- 事件 ---------- */
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    if (STATE.game === b.dataset.game) return;
    STATE.game = b.dataset.game;
    render();
  };
});

function toggleTail() {
  STATE.hideTail = !STATE.hideTail;
  saveTail();
  render();
  toast(STATE.hideTail ? '只显示前 4 位' : '显示全部位数');
}

$('btnTail').onclick = toggleTail;
$('btnTail2').onclick = toggleTail;

$('btnColor').onclick = () => {
  STATE.colorIdx = (STATE.colorIdx + 1) % PALETTES.length;
  applyPalette(STATE.colorIdx);
  toast('数字颜色：' + PALETTES[STATE.colorIdx].name);
};
$('btnColor2').onclick = $('btnColor').onclick;

$('btnFold').onclick = () => { STATE.folded = true; render(); };
$('btnFold2').onclick = () => { STATE.folded = false; render(); };

$('btnRefresh').onclick = () => { toast('正在刷新…'); loadRemote(); };

$('main').addEventListener('click', e => {
  const btn = e.target.closest('[data-toggle]');
  if (!btn) return;
  STATE.expandAll = !STATE.expandAll;
  render();
});

/* ---------- 启动 ---------- */
loadPalette();
loadTail();
render();
loadRemote();
</script>
</body>
</html>
