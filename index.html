<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>开奖号码</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f0f3f8;color:#12151b;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;border:0;outline:0;background:none;color:inherit}
#errBar{position:fixed;left:0;right:0;top:0;z-index:999;display:none;background:#c0162f;color:#fff;font-size:12px;padding:8px 12px}
#errBar.show{display:block}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#header{flex:0 0 auto;padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;padding:8px 12px 4px}
#title{font-size:22px;font-weight:800;margin:0;flex:1 1 auto;white-space:nowrap;overflow:hidden}
.btns{display:flex;align-items:center}
.ico{width:33px;height:33px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(16,24,40,.08);display:flex;align-items:center;justify-content:center;margin-left:5px;font-size:15px;font-weight:700;color:#3a4150}
.wide{height:33px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:0 1px 5px rgba(16,24,40,.08);font-size:14px;font-weight:700;margin-left:5px}
.dot{width:13px;height:13px;border-radius:50%;background:#e01340}
.ring{width:14px;height:14px;border-radius:50%;border:3px solid #e01340}
.tabs{display:flex;padding:2px 12px 6px}
.tab{flex:1 1 0;height:40px;border-radius:13px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 1px 6px rgba(16,24,40,.07);margin:0 4px}
.tab:first-child{margin-left:0}.tab:last-child{margin-right:0}
.tab.active{background:#e6133f;color:#fff;box-shadow:0 5px 14px rgba(230,19,63,.28)}
.tools{display:flex;justify-content:flex-end;padding:0 12px 6px}
.chip{height:29px;padding:0 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 1px 5px rgba(16,24,40,.07);margin-left:6px}
.chip.on,.chip.warn{background:#e6133f;color:#fff}
.meta{padding:0 14px 6px;font-size:12px;color:#98a0ad;white-space:nowrap;overflow:hidden}
header.fold .tabs,header.fold .tools,header.fold .meta{display:none}
#listWrap{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative}
#listWrap::-webkit-scrollbar{width:0}
#listInner{position:relative;min-height:100%;padding:0 0 16px}
#lineLayer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:5}
.card{background:#fff;border-radius:14px;margin:0 8px;overflow:hidden;box-shadow:0 2px 12px rgba(16,24,40,.06)}
.row{display:block;background:#fff;border-bottom:1px solid #f1f3f7}
.row:last-child{border-bottom:0}
.row.grp{border-bottom:3px solid #dce1ea}
.row.newest{background:#fff8fa}
.row-main{display:flex;align-items:center;padding:3px 6px}
.chev{width:20px;height:20px;border-radius:50%;background:#eef7f1;color:#57b98a;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:4px;transition:transform .15s}
.row.open .chev{transform:rotate(90deg);background:#e6f2ff;color:#3b8ed6}
.detail{display:none;padding:0 8px 6px 30px;font-size:12px;color:#98a0ad}
.row.open .detail{display:block}
.nums{flex:1 1 auto;display:flex;align-items:center;min-width:0}
.digit{display:inline-flex;align-items:center;justify-content:center;font-weight:800;line-height:1;flex:0 0 auto;margin-right:4px}
.digit.hid{background:#f2f4f8;border:1px dashed #dfe3ea}
.digit.circled{box-shadow:0 0 0 3px var(--ring,#e01340)}
.digit.slot{background:#fbfcfe;border:1px dashed #d3dae5;color:#3a4150}
.digit.slot.filled{border-style:solid}
.digit.slot.active{box-shadow:0 0 0 2px #e6133f}
body.markmode .digit{touch-action:none}
.empty{padding:46px 24px;text-align:center;color:#a2a9b6;font-size:13px}
#logMask{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(18,22,30,.62);z-index:50;display:none;padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 12px)}
#logMask.show{display:block}
.logbox{height:100%;display:flex;flex-direction:column;background:#0d1015;border:1px solid #212834;border-radius:16px;overflow:hidden}
.loghead{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #1b212b;color:#f1f4f9}
.loghead h2{margin:0;font-size:15px;flex:1 1 auto}
.btnlog{height:30px;padding:0 15px;border-radius:999px;background:#ff3b5c;color:#fff;font-size:13px;font-weight:700;margin-left:8px}
.logbody{flex:1 1 auto;overflow-y:auto;padding:10px 12px;font-family:monospace;font-size:11px;line-height:1.6;color:#8ef0b0;-webkit-user-select:text;user-select:text}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid #e6e8ee;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);transform:translateY(115%);transition:transform .2s}
#pad.show{transform:translateY(0)}
.padhead{display:flex;align-items:center;font-size:13px;color:#6b7385;margin-bottom:4px}
.padhead span{flex:1 1 auto}
.padhead button{height:28px;padding:0 12px;border-radius:999px;background:#f1f3f7;font-size:13px;font-weight:700;margin-left:6px}
.padbox{display:flex;flex-wrap:wrap}
.padbox button{flex:0 0 20%;height:42px;font-size:19px;font-weight:800;color:#1d2430;border-radius:10px}
.padbox button:active{background:#f1f3f7}
#toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,10px);background:rgba(23,26,33,.95);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;transition:.18s;z-index:60;max-width:82%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="errBar"></div>
<script>
window.__boot=0;
window.onerror=function(m,s,l){var b=document.getElementById('errBar');if(!b)return;b.className='show';b.textContent='⚠ 脚本错误：'+m+' 第'+l+'行';return false};
setTimeout(function(){if(!window.__boot){var b=document.getElementById('errBar');if(b&&b.className!='show'){b.className='show';b.textContent='⚠ 启动超时：脚本没跑完（文件可能被截断）'}}},3000);
</script>
<div id="app">
  <header id="header">
    <div class="topbar">
      <h1 id="title">开奖号码</h1>
      <div class="btns">
        <button id="bColor" class="ico"><span class="dot"></span></button>
        <button id="bRing" class="ico"><span class="ring"></span></button>
        <button id="bLog" class="ico">i</button>
        <button id="bFold" class="ico">▲</button>
        <button id="bRefresh" class="wide">刷新</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-type="qxc">七星彩</button>
      <button class="tab" data-type="plw">排列五</button>
    </div>
    <div class="tools">
      <button id="bMark" class="chip">标记</button>
      <button id="bUndo" class="chip">撤销</button>
      <button id="bClear" class="chip">清除</button>
      <button id="bHide" class="chip">隐藏</button>
    </div>
    <div id="meta" class="meta">v6 · 准备中…</div>
  </header>
  <main id="listWrap"><div id="listInner">
    <svg id="lineLayer"><g id="linesG"></g><line id="tempLine" style="display:none"></line></svg>
    <div class="card"><div id="rows"></div></div>
  </div></main>
  <div id="toast"></div>
  <div id="pad">
    <div class="padhead"><span id="padTip">点空格填数字</span><button id="padClear">清空</button><button id="padClose">完成</button></div>
    <div class="padbox" id="padBox">
      <button class="k" data-d="0">0</button><button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button><button class="k" data-d="4">4</button>
      <button class="k" data-d="5">5</button><button class="k" data-d="6">6</button><button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button>
    </div>
  </div>
  <div id="logMask"><div class="logbox">
    <div class="loghead"><h2>抓取日志</h2><button id="logCopy" class="btnlog">复制</button><button id="logClose" class="btnlog">关闭</button></div>
    <div id="logBody" class="logbody"></div>
  </div></div>
</div>
<script>
(function(){
function $(i){return document.getElementById(i)}
function on(i,e,f){var el=$(i);if(el)el.addEventListener(e,f,false)}
function p2(n){n=''+n;return n.length<2?'0'+n:n}
function now(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function upTo(el,c){while(el&&el.nodeType==1){if((' '+el.className+' ').indexOf(' '+c+' ')>=0)return el;el=el.parentNode}return null}
function qs(s){return document.querySelectorAll(s)}

var buf=[];
function log(s){buf.push(s);if(buf.length>300)buf.shift();var b=$('logBody');if(!b)return;var d=document.createElement('div');d.textContent=s;b.appendChild(d);while(b.childNodes.length>300)b.removeChild(b.firstChild);b.scrollTop=b.scrollHeight}
var tt=null;
function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.className='show';clearTimeout(tt);tt=setTimeout(function(){e.className=''},1800)}
function copyTxt(t,ok){
  function done(){toast(ok)}
  function bad(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(ok)}catch(e){toast('复制失败')}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(t).then(done,bad);return}catch(e){}}
  bad();
}

var THEMES=[['#fde9ee','#e01340'],['#e8f1ff','#1565c0'],['#e6f8ee','#13884f'],['#efe9ff','#6a3de0'],['#fff3dc','#ab6b00'],['#e2f6f5','#0f7c78']];
var RING=['#e01340','#ff9500','#0a84ff','#34c759','#ff2d95','#af52de','#ff7a1a','#00c7be'];
var thIdx=0,ringOff=0;
function ring(){return RING[ringOff]}
var S={type:'qxc',data:{qxc:[],plw:[]},blank:{qxc:4,plw:4},mark:0,hide:0,c:{},L:[],U:[],seq:1,busy:0,bv:{}};
function tn(t){return t=='plw'?'排列五':'七星彩'}
function want(t){return t=='plw'?5:7}
function setStatus(s){var e=$('meta');if(e)e.textContent=s}
function metaNow(src){var d=new Date();setStatus('更新于 '+(d.getMonth()+1)+'月'+d.getDate()+'日 '+p2(d.getHours())+':'+p2(d.getMinutes())+'（'+src+'）')}

function mt(){
  var w=$('listWrap'),H=(w&&w.clientHeight)?w.clientHeight:540,W=(w&&w.clientWidth)?w.clientWidth:360;
  var rh=Math.floor(H/15);if(rh<32)rh=32;if(rh>68)rh=68;
  var dh=rh-7;if(dh<20)dh=20;
  var f=(want(S.type)==5);
  var bw=Math.round(dh*(f?1.7:1.48)),sw=Math.round(dh*0.92),cw=W-52;
  var need=f?(bw*5+16):(bw*4+sw*3+24);
  if(need>cw){var k=cw/need;bw=Math.floor(bw*k);if(!f)sw=Math.floor(sw*k)}
  return {rh:rh,dh:dh,bw:bw,sw:sw,f1:Math.max(12,Math.round(Math.min(dh*0.8,bw*0.62))),f2:Math.max(10,Math.round(Math.min(dh*0.52,sw*0.72))),r:Math.max(6,Math.round(dh*0.3))};
}
function pl(q){q=''+q;return q.length>=7?q.substr(4):q}
function fd(d){d=''+d;var m=d.match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);if(m)return m[1]+'年'+(+m[2])+'月'+(+m[3])+'日';var a=d.replace(/[^0-9]/g,'');if(a.length>=8)return a.substr(0,4)+'年'+(+a.substr(4,2))+'月'+(+a.substr(6,2))+'日';return d}

function render(toNew){
  var rows=S.data[S.type]||[],box=$('rows');if(!box)return;
  var wrap=$('listWrap'),keep=wrap?wrap.scrollTop:0,n=rows.length,w=want(S.type),m=mt(),col=THEMES[thIdx];
  var bl=S.blank[S.type];if(bl==null)bl=4;
  var total=n+bl,h=[],i,j,cls,k,sm,cir,hid,st,row,bp,bk,bv,bi;
  if(!n){box.innerHTML='<div class="empty">还没有数据<br>点右上角「刷新」重新获取</div>';return}
  for(i=0;i<total;i++){
    bp=total-i;cls='row';if(bp%4==0&&i<total-1)cls+=' grp';
    if(i<n){
      row=rows[i];if(i==n-1)cls+=' newest';
      h.push('<div class="'+cls+'"><div class="row-main"><span class="chev">›</span><div class="nums">');
      for(j=0;j<row.n.length;j++){
        sm=(w==7&&j>=4);hid=(S.hide&&j>=4);
        if(hid){h.push('<span class="digit hid" style="width:'+m.sw+'px;height:'+m.dh+'px;border-radius:5px"></span>');continue}
        k=row.q+'-'+j;cir=S.c[k]?1:0;
        st='width:'+(sm?m.sw:m.bw)+'px;height:'+m.dh+'px;font-size:'+(sm?m.f2:m.f1)+'px;border-radius:'+(sm?Math.max(5,m.r-2):m.r)+'px;background:'+col[0]+';color:'+col[1]+';';
        if(cir)st+='--ring:'+ring()+';';
        h.push('<span class="digit'+(cir?' circled':'')+'" data-k="'+esc(k)+'" style="'+st+'">'+esc(row.n[j])+'</span>');
      }
      h.push('</div></div><div class="detail">第 '+esc(pl(row.q))+' 期 · '+esc(fd(row.d))+'</div></div>');
    }else{
      bi=total-1-i;
      h.push('<div class="'+cls+' blank"><div class="row-main"><span class="chev"></span><div class="nums">');
      for(j=0;j<w;j++){
        sm=(w==7&&j>=4);bk='b'+bi+'-'+j;bv=S.bv[bk]||'';
        st='width:'+(sm?m.sw:m.bw)+'px;height:'+m.dh+'px;font-size:'+(sm?m.f2:m.f1)+'px;border-radius:'+(sm?Math.max(5,m.r-2):m.r)+'px;';
        if(bv)st+='background:'+col[0]+';border-color:transparent;color:'+col[1]+';';
        h.push('<span class="digit slot'+(bv?' filled':'')+'" data-b="'+bk+'" style="'+st+'">'+esc(bv)+'</span>');
      }
      h.push('</div></div></div>');
    }
  }
  box.innerHTML=h.join('');
  if(wrap){if(toNew){var t=wrap.scrollHeight-wrap.clientHeight-m.rh*bl;wrap.scrollTop=t>0?t:0}else wrap.scrollTop=keep}
  setTimeout(draw,0);
}
function dEl(k){var b=$('rows');if(!b)return null;try{return b.querySelector('[data-k="'+k+'"]')}catch(e){return null}}
function ctr(el){var r=el.getBoundingClientRect(),ir=$('listInner').getBoundingClientRect();return {x:r.left-ir.left+r.width/2,y:r.top-ir.top+r.height/2}}
function draw(){
  var svg=$('lineLayer'),g=$('linesG'),inn=$('listInner');if(!svg||!g||!inn)return;
  svg.style.width=inn.clientWidth+'px';svg.style.height=inn.scrollHeight+'px';
  while(g.firstChild)g.removeChild(g.firstChild);
  for(var i=0;i<S.L.length;i++){
    var a=dEl(S.L[i].a),b=dEl(S.L[i].b);if(!a||!b)continue;
    var pa=ctr(a),pb=ctr(b),ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',pa.x);ln.setAttribute('y1',pa.y);ln.setAttribute('x2',pb.x);ln.setAttribute('y2',pb.y);
    ln.setAttribute('stroke',ring());ln.setAttribute('stroke-width','3');ln.setAttribute('stroke-linecap','round');
    g.appendChild(ln);
  }
}
function tmp(x,y){var t=$('tempLine');if(!t||!press||!press.el)return;var ir=$('listInner').getBoundingClientRect(),a=ctr(press.el);
  t.setAttribute('x1',a.x);t.setAttribute('y1',a.y);t.setAttribute('x2',x-ir.left);t.setAttribute('y2',y-ir.top);
  t.setAttribute('stroke',ring());t.setAttribute('stroke-width','3');t.setAttribute('stroke-dasharray','7 6');t.style.display=''}
function tmpHide(){var t=$('tempLine');if(t)t.style.display='none'}

function mkey(){return 'qx_m1_'+S.type}
function loadMarks(){try{var r=localStorage.getItem(mkey());if(!r)return;var o=JSON.parse(r);S.c=o.c||{};S.L=o.L||[];S.seq=o.s||1}catch(e){}}
function saveMarks(){try{localStorage.setItem(mkey(),JSON.stringify({c:S.c,L:S.L,s:S.seq}))}catch(e){}}
function loadHide(){try{S.hide=localStorage.getItem('qx_h1')=='1'}catch(e){S.hide=0}}
function saveHide(){try{localStorage.setItem('qx_h1',S.hide?'1':'0')}catch(e){}}
function loadLook(){
  try{var a=+localStorage.getItem('qx_t1');if(a>=0&&a<THEMES.length)thIdx=a;
      var b=+localStorage.getItem('qx_r1');if(b>=0&&b<RING.length)ringOff=b}catch(e){}
}
function saveLook(){try{localStorage.setItem('qx_t1',thIdx);localStorage.setItem('qx_r1',ringOff)}catch(e){}}
function bvkey(){return 'qx_bv1_'+S.type}
function loadBV(){try{var r=localStorage.getItem(bvkey());S.bv=r?JSON.parse(r):{}}catch(e){S.bv={}}}
function saveBV(){try{localStorage.setItem(bvkey(),JSON.stringify(S.bv))}catch(e){}}
function bmem(){try{var r=localStorage.getItem('qx_b1');return r?JSON.parse(r):{b:{},q:{}}}catch(e){return {b:{},q:{}}}}
function bsave(m){try{localStorage.setItem('qx_b1',JSON.stringify(m))}catch(e){}}
function initBlanks(){var m=bmem();S.blank.qxc=(m.b.qxc==null?4:m.b.qxc);S.blank.plw=(m.b.plw==null?4:m.b.plw)}
function updBlanks(t,rows){
  if(!rows||!rows.length)return;
  var m=bmem(),b=(m.b[t]==null?4:m.b[t]),last=m.q[t],newest=rows[rows.length-1].q;
  if(last&&+newest>+last){var add=0,i;for(i=rows.length-1;i>=0;i++){break}}
  if(last&&+newest>+last){var ad=0,j;for(j=rows.length-1;j>=0;j++){if(j<0)break;if(+rows[j].q>+last)ad++;else break}b-=ad;if(b<=1)b=4}
  m.b[t]=b;m.q[t]=newest;bsave(m);S.blank[t]=b;log('· 空白期：'+b+' 期');
}

function setC(k,v){
  var el=dEl(k);
  if(!v){delete S.c[k];if(el){el.className=el.className.replace(/ circled/g,'');try{el.style.removeProperty('--ring')}catch(e){}}}
  else{S.c[k]=1;if(el){if(el.className.indexOf('circled')<0)el.className+=' circled';el.style.setProperty('--ring',ring())}}
  saveMarks();
}
function toggleC(k){var was=S.c[k]?1:0;setC(k,!was);S.U.push({t:'c',k:k,p:was})}
function undo(){
  var a=S.U.pop();if(!a){toast('没有可撤销的操作');return}
  if(a.t=='c')setC(a.k,!!a.p);
  else{for(var i=S.L.length-1;i>=0;i--){if(S.L[i].id==a.id){S.L.splice(i,1);break}}draw();saveMarks()}
  toast('已撤销');
}
function applyRing(){
  for(var k in S.c){if(!S.c.hasOwnProperty(k))continue;var el=dEl(k);if(el){if(el.className.indexOf('circled')<0)el.className+=' circled';el.style.setProperty('--ring',ring())}}
  draw();
}

var padKey=null;
function slotEl(k){try{return document.querySelector('[data-b="'+k+'"]')}catch(e){return null}}
function setSlot(k,v){
  S.bv[k]=v;saveBV();
  var el=slotEl(k);if(!el)return;
  el.textContent=v||'';
  if(v){if(el.className.indexOf('filled')<0)el.className+=' filled';el.style.background=THEMES[thIdx][0];el.style.color=THEMES[thIdx][1];el.style.borderColor='transparent'}
  else{el.className=el.className.replace(/ filled/g,'');el.style.background='';el.style.color='';el.style.borderColor=''}
}
function openPad(k){
  padKey=k;
  var all=qs('.slot');
  for(var i=0;i<all.length;i++)all[i].className=all[i].className.replace(/ active/g,'');
  var el=slotEl(k);if(!el)return;
  el.className+=' active';
  var p=k.split('-'),j=+p[1];
  $('padTip').textContent='第 '+(j+1)+' 位（空白期）';
  $('pad').className='pad show';
}
function closePad(){
  padKey=null;$('pad').className='pad';
  var all=qs('.slot');
  for(var i=0;i<all.length;i++)all[i].className=all[i].className.replace(/ active/g,'');
}
function padDigit(d){
  if(!padKey)return;
  setSlot(padKey,d);
  var p=padKey.split('-'),bi=p[0],j=+p[1],w=want(S.type);
  if(j+1<w)openPad(bi+'-'+(j+1));
  else{toast('这一行填好了');closePad()}
}

function dec(u8){
  var h='',i,n=Math.min(u8.length,300);
  for(i=0;i<n;i++)h+=String.fromCharCode(u8[i]);
  var m=h.match(/encoding\s*=\s*["']?([\w-]+)/i),lab=m?m[1].toLowerCase():'utf-8';
  if(/^gb/.test(lab))lab='gbk';
  try{return new TextDecoder(lab).decode(u8)}catch(e){try{return new TextDecoder('utf-8').decode(u8)}catch(e2){return ''}}
}
function getTxt(url){
  log('GET '+url);
  return new Promise(function(ok,no){
    fetch(url,{cache:'no-store'}).then(function(r){
      log('  HTTP '+r.status);
      if(!r.ok){no(new Error('HTTP '+r.status));return}
      if(r.arrayBuffer)return r.arrayBuffer().then(function(b){var u=new Uint8Array(b);log('  '+Math.round(u.length/1024)+' KB');ok(dec(u))});
      return r.text().then(ok,no);
    }).catch(function(e){
      fetch(url).then(function(r){return r.text()}).then(ok,no);
    });
  });
}
function attrs(s){
  var o={},m,r1=/([\w.:-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g,r2=/<([\w.:-]+)[^>]*>([\s\S]*?)<\/\s*\1\s*>/g;
  while((m=r1.exec(s)))o[m[1].toLowerCase()]=(m[2]!==undefined?m[2]:m[3]);
  while((m=r2.exec(s))){var k=m[1].toLowerCase();if(o[k]===undefined)o[k]=m[2].replace(/<[^>]*>/g,'').replace(/^\s+|\s+$/g,'')}
  return o;
}
function pick(o,l){for(var i=0;i<l.length;i++){var v=o[l[i]];if(v!=null&&String(v).replace(/\s/g,'')!=='')return String(v)}return null}
function numsOf(s){
  if(s==null)return null;
  var p=String(s).split(/[^0-9]+/),t=[],c=[],i,j;
  for(i=0;i<p.length;i++)if(p[i])t.push(p[i]);
  for(i=0;i<t.length;i++){if(t[i].length<=2)c.push(t[i].charAt(t[i].length-1));else for(j=0;j<t[i].length;j++)c.push(t[i].charAt(j))}
  if(c.length==5||c.length==7)return c;
  var a=String(s).replace(/[^0-9]/g,'');
  if(a.length==5||a.length==7)return a.split('');
  return null;
}
function parseXml(txt,w){
  var out=[],re=/<(row|item|i)(?=[\s\/>])([^>]*)>/gi,m,open,tag,self,rest,ci,inner,at,q,d,nr;
  while((m=re.exec(txt))){
    open=m[0];tag=m[1];self=/\/\s*>$/.test(open);inner='';
    if(!self){rest=txt.substring(re.lastIndex);ci=rest.search(new RegExp('<\\s*\\/\\s*'+tag+'\\s*>','i'));if(ci>=0){inner=rest.substring(0,ci);re.lastIndex+=ci}}
    at=attrs(open+inner);
    q=pick(at,['expect','issue','qihao','term','period','no']);if(!q)continue;
    d=pick(at,['opendate','openday','opentime','date','day','time'])||'';
    nr=numsOf(pick(at,['opencode','opennum','nums','numbers','number','num','result','code','value']));
    if(!nr||nr.length!=w)continue;
    var qq=q.replace(/[^0-9]/g,'');if(!qq)continue;
    out.push({q:qq,d:d,n:nr});
  }
  return out;
}
function looksDate(s){return /(\d{4})[-\/年.]\d{1,2}[-\/月.]\d{1,2}/.test(s)}
function dArr(v){if(!v||v.length===undefined||(v.length!=5&&v.length!=7))return null;var o=[],i,s;for(i=0;i<v.length;i++){s=String(v[i]).replace(/[^0-9]/g,'');if(!s)return null;o.push(s.charAt(s.length-1))}return o}
function fromObj(o){
  var ks=[],k,i,j,v,nr=null,q='',d='';
  for(k in o)if(o.hasOwnProperty(k))ks.push(k);
  var NK=['opencode','opennum','opennums','nums','numbers','number','num','n','balls','ball','result','results','digits','winning','value','values','code'],
      QK=['expect','issue','qihao','qishu','term','period','stage','q','qi','no'],
      DK=['opendate','openday','opentime','date','day','time','drawdate','d'];
  for(i=0;i<NK.length&&!nr;i++)for(j=0;j<ks.length&&!nr;j++){if(ks[j].toLowerCase()==NK[i]){v=o[ks[j]];nr=dArr(v)||((typeof v=='string'||typeof v=='number')?numsOf(v):null)}}
  if(!nr)for(j=0;j<ks.length&&!nr;j++)nr=dArr(o[ks[j]]);
  if(!nr)return null;
  for(i=0;i<QK.length&&!q;i++)for(j=0;j<ks.length&&!q;j++){if(ks[j].toLowerCase()==QK[i]){var s=String(o[ks[j]]).replace(/[^0-9]/g,'');if(s.length>=5)q=s}}
  if(!q)for(j=0;j<ks.length&&!q;j++){v=o[ks[j]];var g=String(v).replace(/[^0-9]/g,'');if(g.length>=5&&g.length<=11&&!looksDate(String(v))&&g!==nr.join(''))q=g}
  for(i=0;i<DK.length&&!d;i++)for(j=0;j<ks.length&&!d;j++){if(ks[j].toLowerCase()==DK[i]&&o[ks[j]]!=null)d=String(o[ks[j]])}
  if(!q)return null;
  return {q:q,d:d,n:nr};
}
function scan(o,dep,out){
  if(!o||typeof o!='object'||dep>8)return;
  if(Object.prototype.toString.call(o)=='[object Array]'){for(var i=0;i<o.length&&i<500;i++)scan(o[i],dep+1,out);return}
  var ks=[],k,i,isMap=true;
  for(k in o)if(o.hasOwnProperty(k))ks.push(k);
  for(i=0;i<ks.length;i++){if(!/^\d{5,11}$/.test(ks[i])){isMap=false;break}}
  if(isMap&&ks.length){
    for(i=0;i<ks.length;i++){var ch=o[ks[i]];if(!ch||typeof ch!='object')continue;var r0=fromObj(ch);if(r0){r0.q=ks[i];out.push(r0);continue}var n0=dArr(ch);if(n0)out.push({q:ks[i],d:'',n:n0})}
    return;
  }
  var r=fromObj(o);if(r)out.push(r);
  for(i=0;i<ks.length;i++){var c=o[ks[i]];if(c&&typeof c=='object')scan(c,dep+1,out)}
}
function finish(rows){
  var m={},out=[],k,i;
  for(i=0;i<rows.length;i++){var r=rows[i];if(r&&r.q&&r.n&&r.n.length)m[r.q]=r}
  for(k in m)if(m.hasOwnProperty(k))out.push(m[k]);
  out.sort(function(a,b){return a.q*1-b.q*1});
  if(out.length>30)out=out.slice(out.length-30);
  return out;
}
function loadDirect(t){

      if(!r.length){log('  · 解析 0 期｜'+String(x).replace(/\s+/g,' ').substr(0,100));return next()}
      log('  ✓ 解析 '+r.length+' 期');return r;
    }).catch(function(e){log('  · 失败：'+(e.message||e));return next()});
  }

}
function loadJson(u){

    }

}
